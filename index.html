<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podgląd WMS</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:16px;
    background:#f4f4f4;
    color:#111;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    width:100%;
    max-width:650px;
    margin:0 auto;
}

.hidden{display:none!important}

.card{
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:14px;
}

h1{
    margin:0 0 6px;
    font-size:27px;
}

h2{
    margin:0 0 15px;
    font-size:22px;
}

.subtitle{
    color:#777;
    font-size:14px;
    margin-bottom:22px;
}

label{
    display:block;
    margin:14px 0 6px;
    font-size:13px;
    font-weight:bold;
}

input,select{
    width:100%;
    min-height:50px;
    padding:10px 12px;
    border:1px solid #aaa;
    border-radius:6px;
    font-size:18px;
    background:#fff;
}

button{
    width:100%;
    min-height:50px;
    margin-top:10px;
    padding:10px;
    border:0;
    border-radius:6px;
    background:#111;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#e8e8e8;
    color:#111;
}

button.danger{
    background:#555;
}

button:disabled{
    opacity:.55;
}

.message{
    min-height:22px;
    margin-top:12px;
    text-align:center;
    font-size:14px;
}

.error{
    color:#a00000;
    font-weight:bold;
}

.top{
    display:flex;
    align-items:center;
    gap:10px;
}

.top h1{
    flex:1;
}

.role{
    padding:8px 10px;
    background:#111;
    color:#fff;
    font-size:12px;
    font-weight:bold;
}

.userbar{
    margin-top:10px;
    padding:9px 10px;
    background:#eee;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
}

.userbar span{
    flex:1;
    font-weight:bold;
}

.logout{
    width:auto;
    min-height:36px;
    margin:0;
    padding:6px 12px;
    font-size:12px;
}

.result{
    border:1px solid #ddd;
    border-radius:7px;
    padding:14px;
    margin-top:10px;
}

.code{
    font-size:20px;
    font-weight:bold;
    word-break:break-all;
}

.address{
    margin-top:8px;
    font-size:19px;
    font-weight:bold;
}

.count{
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
}

.user-row{
    border:1px solid #ddd;
    padding:12px;
    margin-top:8px;
}

.user-login{
    font-size:18px;
    font-weight:bold;
}

.user-role{
    margin-top:4px;
    color:#666;
    font-size:13px;
}

.small{
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<!-- ================= LOGIN ================= -->

<div id="loginView">

    <div class="card">

        <h1>🔐 PODGLĄD WMS</h1>

        <div class="subtitle">
            Logowanie do systemu
        </div>

        <label for="loginInput">LOGIN</label>

        <input
            id="loginInput"
            type="text"
            autocomplete="username"
            placeholder="Login"
        >

        <label for="passwordInput">HASŁO</label>

        <input
            id="passwordInput"
            type="password"
            autocomplete="current-password"
            placeholder="Hasło"
        >

        <button id="loginButton">
            ZALOGUJ
        </button>

        <div id="loginMessage" class="message"></div>

    </div>

</div>


<!-- ================= MAIN ================= -->

<div id="mainView" class="hidden">

    <div class="card">

        <div class="top">

            <h1>PODGLĄD WMS</h1>

            <div id="roleBadge" class="role"></div>

        </div>

        <div class="userbar">

            <span id="userInfo"></span>

            <button
                id="logoutButton"
                class="logout secondary"
            >
                WYLOGUJ
            </button>

        </div>


        <button id="searchBtn">
            🔎 SZUKAJ ETYKIETY
        </button>


        <button
            id="adminBtn"
            class="hidden"
        >
            ⚙️ PANEL ADMINA
        </button>

    </div>

</div>


<!-- ================= SEARCH ================= -->

<div id="searchView" class="hidden">

    <div class="card">

        <button
            class="secondary"
            onclick="showMain()"
        >
            ← POWRÓT
        </button>

        <h2>🔎 SZUKAJ ETYKIETY</h2>

        <label for="searchInput">
            FRAGMENT NUMERU ETYKIETY
        </label>

        <input
            id="searchInput"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="np. 591"
        >

        <button id="searchButton">
            SZUKAJ
        </button>

        <div id="searchMessage" class="message"></div>

    </div>


    <div class="card">

        <div id="searchResults">
            Wpisz fragment numeru etykiety.
        </div>

    </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminView" class="hidden">

    <div class="card">

        <button
            class="secondary"
            onclick="showMain()"
        >
            ← POWRÓT
        </button>

        <h2>⚙️ PANEL ADMINA</h2>

        <div class="small">
            Zarządzanie kontami użytkowników.
        </div>


        <h3>➕ NOWE KONTO</h3>

        <label for="newLogin">
            LOGIN
        </label>

        <input
            id="newLogin"
            type="text"
            autocomplete="off"
            placeholder="Login użytkownika"
        >

        <label for="newPassword">
            HASŁO
        </label>

        <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Hasło użytkownika"
        >

        <label for="newRole">
            ROLA
        </label>

        <select id="newRole">
            <option value="OPERATOR">OPERATOR</option>
            <option value="ADMIN">ADMIN</option>
        </select>

        <button id="createUserButton">
            UTWÓRZ KONTO
        </button>

        <div id="createUserMessage" class="message"></div>

    </div>


    <div class="card">

        <h2>👥 UŻYTKOWNICY</h2>

        <button
            id="refreshUsersButton"
            class="secondary"
        >
            ↻ ODŚWIEŻ LISTĘ
        </button>

        <div id="usersList"></div>

    </div>

</div>


</div>


<script>

/* =====================================================
   KONFIGURACJA
   ===================================================== */

/*
 * 1. Code.gs v4
 *    - logowanie
 *    - sesje
 *    - ADMIN / OPERATOR
 *    - tworzenie użytkowników
 *
 * 2. PodgladSkaner.gs
 *    - TYLKO ODCZYT DANYCH
 *    - action=get
 */

const AUTH_API_URL =
    'https://script.google.com/macros/s/AKfycbwd2-sYSpIw0N_MUo5xMSH7IHDSBX8Jtx4YznnlWr33CihUXiax6CQAIPD3r6Arr74dvw/exec';


const DATA_API_URL =
    'https://script.google.com/macros/s/AKfycbxtZOSSEPQhVpGVi2huYORDDFJwPcyXoIMINk-P43s_PZNMrBTSmhPeqytZUgWOlRCU2Q/exec';


/* =====================================================
   ZMIENNE
   ===================================================== */

let currentUser = null;

let scans = [];


/* =====================================================
   SKRÓT
   ===================================================== */

function $(id){
    return document.getElementById(id);
}


/* =====================================================
   JSONP
   ===================================================== */

function apiJsonp(baseUrl, action, params = {}){

    return new Promise((resolve,reject)=>{

        const callback =
            'wms_' +
            Date.now() +
            '_' +
            Math.floor(
                Math.random()*100000
            );

        const script =
            document.createElement(
                'script'
            );

        const query =
            new URLSearchParams();

        query.set(
            'action',
            action
        );

        query.set(
            'callback',
            callback
        );

        Object.keys(params).forEach(
            key => {

                if(
                    params[key] !== undefined &&
                    params[key] !== null
                ){

                    query.set(
                        key,
                        String(params[key])
                    );
                }
            }
        );

        let done = false;

        const cleanup = ()=>{

            if(done) return;

            done = true;

            clearTimeout(timer);

            delete window[callback];

            script.remove();
        };


        const timer =
            setTimeout(
                ()=>{
                    cleanup();

                    reject(
                        new Error(
                            'Brak odpowiedzi serwera.'
                        )
                    );
                },
                15000
            );


        window[callback] =
            data => {

                cleanup();

                resolve(
                    data
                );
            };


        script.onerror =
            ()=>{

                cleanup();

                reject(
                    new Error(
                        'Błąd połączenia z Google Apps Script.'
                    )
                );
            };


        script.src =
            baseUrl +
            '?' +
            query.toString();


        document.body.appendChild(
            script
        );
    });
}


/* =====================================================
   SESJA
   ===================================================== */

function getToken(){

    return sessionStorage.getItem(
        'wms_token'
    );
}


function clearSession(){

    sessionStorage.removeItem(
        'wms_token'
    );

    sessionStorage.removeItem(
        'wms_login'
    );

    sessionStorage.removeItem(
        'wms_role'
    );
}


/* =====================================================
   LOGIN
   ===================================================== */

async function login(){

    const loginValue =
        $('loginInput')
            .value
            .trim();

    const password =
        $('passwordInput')
            .value;


    if(
        !loginValue ||
        !password
    ){

        $('loginMessage').textContent =
            'Podaj login i hasło.';

        return;
    }


    $('loginButton').disabled =
        true;

    $('loginButton').textContent =
        'LOGOWANIE...';


    try{

        const result =
            await apiJsonp(
                AUTH_API_URL,
                'login',
                {
                    login:
                        loginValue,

                    password:
                        password
                }
            );


        if(
            !result ||
            !result.ok
        ){

            throw new Error(
                result?.message ||
                'Nieprawidłowy login lub hasło.'
            );
        }


        sessionStorage.setItem(
            'wms_token',
            result.token
        );

        sessionStorage.setItem(
            'wms_login',
            result.login
        );

        sessionStorage.setItem(
            'wms_role',
            String(
                result.role || 'OPERATOR'
            ).toUpperCase()
        );


        currentUser = {

            login:
                result.login,

            role:
                String(
                    result.role ||
                    'OPERATOR'
                ).toUpperCase(),

            token:
                result.token
        };


        $('passwordInput').value =
            '';

        $('loginMessage').textContent =
            '';


        showLoggedIn();


    }catch(error){

        $('loginMessage').innerHTML =
            '<span class="error">' +
            escapeHtml(
                error.message
            ) +
            '</span>';

    }finally{

        $('loginButton').disabled =
            false;

        $('loginButton').textContent =
            'ZALOGUJ';
    }
}


/* =====================================================
   SPRAWDZENIE SESJI
   ===================================================== */

async function checkSession(){

    const token =
        getToken();


    if(!token){

        showLogin();

        return;
    }


    try{

        const result =
            await apiJsonp(
                AUTH_API_URL,
                'checkSession',
                {
                    token:
                        token
                }
            );


        if(
            !result ||
            !result.loggedIn
        ){

            clearSession();

            showLogin();

            return;
        }


        currentUser = {

            login:
                result.login,

            role:
                String(
                    result.role ||
                    'OPERATOR'
                ).toUpperCase(),

            token:
                token
        };


        showLoggedIn();


    }catch(error){

        clearSession();

        showLogin();
    }
}


/* =====================================================
   WIDOKI
   ===================================================== */

function hideAll(){

    [
        'mainView',
        'searchView',
        'adminView'
    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );
        }
    );
}


function showLogin(){

    hideAll();

    $('loginView')
        .classList
        .remove(
            'hidden'
        );
}


function showMain(){

    hideAll();

    $('mainView')
        .classList
        .remove(
            'hidden'
        );
}


function showLoggedIn(){

    $('loginView')
        .classList
        .add(
            'hidden'
        );


    showMain();


    const role =
        String(
            currentUser?.role ||
            'OPERATOR'
        ).toUpperCase();


    $('userInfo').textContent =
        '👤 ' +
        currentUser.login;


    $('roleBadge').textContent =
        role;


    if(
        role === 'ADMIN'
    ){

        $('adminBtn')
            .classList
            .remove(
                'hidden'
            );

    }else{

        $('adminBtn')
            .classList
            .add(
                'hidden'
            );
    }
}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

    const token =
        getToken();


    try{

        if(token){

            await apiJsonp(
                AUTH_API_URL,
                'logout',
                {
                    token:
                        token
                }
            );
        }

    }catch(_){}


    clearSession();

    currentUser =
        null;

    scans =
        [];

    $('passwordInput').value =
        '';

    showLogin();
}


/* =====================================================
   DANE Z PODGLADSkaner.gs
   ===================================================== */

async function loadPreviewData(){

    $('searchMessage').textContent =
        'Pobieranie danych...';


    try{

        /*
         * UWAGA:
         * To jest jedyne wywołanie
         * do PodgladSkaner.gs.
         *
         * TYLKO action=get.
         */

        const result =
            await apiJsonp(
                DATA_API_URL,
                'get'
            );


        if(
            !result ||
            result.status !== 'OK'
        ){

            throw new Error(
                result?.message ||
                'Nieprawidłowa odpowiedź.'
            );
        }


        scans =
            Array.isArray(
                result.data
            )
                ? result.data
                : [];


        $('searchMessage').textContent =
            'Dane pobrane: ' +
            scans.length;


    }catch(error){

        $('searchMessage').innerHTML =
            '<span class="error">' +
            escapeHtml(
                error.message
            ) +
            '</span>';

        throw error;
    }
}


/* =====================================================
   SZUKANIE
   ===================================================== */

async function openSearch(){

    hideAll();

    $('searchView')
        .classList
        .remove(
            'hidden'
        );

    $('searchInput').value =
        '';

    $('searchResults').innerHTML =
        'Pobieranie danych...';

    $('searchMessage').textContent =
        '';


    try{

        await loadPreviewData();

        $('searchResults').innerHTML =
            'Wpisz fragment numeru etykiety.';

        setTimeout(
            ()=>{
                $('searchInput').focus();
            },
            100
        );

    }catch(_){

        $('searchResults').innerHTML =
            '<div class="message error">' +
            'Nie udało się pobrać danych.' +
            '</div>';
    }
}


function searchLabel(){

    const q =
        $('searchInput')
            .value
            .trim();


    if(!q){

        $('searchResults').innerHTML =
            '<div class="message">' +
            'Wpisz fragment numeru etykiety.' +
            '</div>';

        return;
    }


    const found =
        scans.filter(
            scan => {

                const code =
                    String(
                        scan.code || ''
                    ).trim();


                return code
                    .toLowerCase()
                    .includes(
                        q.toLowerCase()
                    );
            }
        );


    if(!found.length){

        $('searchResults').innerHTML =
            '<div class="message">' +
            'BRAK WYNIKÓW' +
            '</div>';

        return;
    }


    let html =
        '<div class="count">' +
        'ZNALEZIONO: ' +
        found.length +
        '</div>';


    found.forEach(
        scan => {

            html +=
                '<div class="result">' +

                    '<div class="code">' +
                        escapeHtml(
                            scan.code
                        ) +
                    '</div>' +

                    '<div class="address">' +
                        escapeHtml(
                            formatAddress(
                                scan.address
                            )
                        ) +
                    '</div>' +

                '</div>';
        }
    );


    $('searchResults').innerHTML =
        html;
}


/* =====================================================
   LOKALIZACJA
   ===================================================== */

function formatAddress(address){

    const value =
        String(
            address || ''
        ).trim();


    if(
        /^\d{6}$/.test(
            value
        )
    ){

        return (
            value.substring(
                0,
                3
            ) +
            ' ' +
            value.substring(
                3,
                6
            )
        );
    }


    return value ||
        'BRAK LOKALIZACJI';
}


/* =====================================================
   ADMIN — UŻYTKOWNICY
   ===================================================== */

async function openAdmin(){

    if(
        String(
            currentUser?.role || ''
        ).toUpperCase() !== 'ADMIN'
    ){

        alert(
            'BRAK UPRAWNIEŃ.'
        );

        return;
    }


    hideAll();

    $('adminView')
        .classList
        .remove(
            'hidden'
        );


    $('createUserMessage')
        .textContent =
        '';


    await loadUsers();
}


async function loadUsers(){

    $('usersList').innerHTML =
        '<div class="message">' +
        'Pobieranie użytkowników...' +
        '</div>';


    try{

        const result =
            await apiJsonp(
                AUTH_API_URL,
                'getUsers',
                {
                    token:
                        getToken()
                }
            );


        if(
            !result ||
            !result.ok
        ){

            throw new Error(
                result?.message ||
                'Nie udało się pobrać użytkowników.'
            );
        }


        const users =
            Array.isArray(
                result.users
            )
                ? result.users
                : [];


        if(!users.length){

            $('usersList').innerHTML =
                '<div class="message">' +
                'Brak użytkowników.' +
                '</div>';

            return;
        }


        let html = '';


        users.forEach(
            user => {

                html +=
                    '<div class="user-row">' +

                        '<div class="user-login">' +
                            escapeHtml(
                                user.login
                            ) +
                        '</div>' +

                        '<div class="user-role">' +
                            escapeHtml(
                                user.role
                            ) +

                            ' — ' +

                            (
                                user.active
                                    ? 'AKTYWNY'
                                    : 'NIEAKTYWNY'
                            ) +

                        '</div>' +

                    '</div>';
            }
        );


        $('usersList').innerHTML =
            html;


    }catch(error){

        $('usersList').innerHTML =
            '<div class="message error">' +
            escapeHtml(
                error.message
            ) +
            '</div>';
    }
}


/* =====================================================
   CREATE USER
   ===================================================== */

async function createUser(){

    const login =
        $('newLogin')
            .value
            .trim();

    const password =
        $('newPassword')
            .value;

    const role =
        $('newRole')
            .value;


    if(
        !login ||
        !password
    ){

        $('createUserMessage').innerHTML =
            '<span class="error">' +
            'Podaj login i hasło.' +
            '</span>';

        return;
    }


    $('createUserButton').disabled =
        true;

    $('createUserButton').textContent =
        'TWORZENIE...';


    try{

        const result =
            await apiJsonp(
                AUTH_API_URL,
                'createUser',
                {
                    token:
                        getToken(),

                    login:
                        login,

                    password:
                        password,

                    role:
                        role
                }
            );


        if(
            !result ||
            !result.ok
        ){

            throw new Error(
                result?.message ||
                'Nie udało się utworzyć konta.'
            );
        }


        $('newLogin').value =
            '';

        $('newPassword').value =
            '';

        $('newRole').value =
            'OPERATOR';


        $('createUserMessage').textContent =
            'Konto utworzone.';


        await loadUsers();


    }catch(error){

        $('createUserMessage').innerHTML =
            '<span class="error">' +
            escapeHtml(
                error.message
            ) +
            '</span>';

    }finally{

        $('createUserButton').disabled =
            false;

        $('createUserButton').textContent =
            'UTWÓRZ KONTO';
    }
}


/* =====================================================
   ESCAPE
   ===================================================== */

function escapeHtml(value){

    return String(
        value ?? ''
    )
    .replaceAll(
        '&',
        '&amp;'
    )
    .replaceAll(
        '<',
        '&lt;'
    )
    .replaceAll(
        '>',
        '&gt;'
    )
    .replaceAll(
        '"',
        '&quot;'
    )
    .replaceAll(
        "'",
        '&#039;'
    );
}


/* =====================================================
   EVENTY
   ===================================================== */

$('loginButton').onclick =
    login;

$('logoutButton').onclick =
    logout;

$('searchBtn').onclick =
    openSearch;

$('searchButton').onclick =
    searchLabel;

$('adminBtn').onclick =
    openAdmin;

$('createUserButton').onclick =
    createUser;

$('refreshUsersButton').onclick =
    loadUsers;


$('passwordInput').addEventListener(
    'keydown',
    event => {

        if(
            event.key === 'Enter'
        ){

            login();
        }
    }
);


$('searchInput').addEventListener(
    'keydown',
    event => {

        if(
            event.key === 'Enter'
        ){

            searchLabel();
        }
    }
);


/* =====================================================
   START
   ===================================================== */

checkSession();

</script>

</body>
</html>
