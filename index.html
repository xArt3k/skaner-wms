<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    'https://script.google.com/macros/s/AKfycbwd2-sYSpIw0N_MUo5xMSH7IHDSBX8Jtx4YznnlWr33CihUXiax6CQAIPD3r6Arr74dvw/exec';


/* =========================================================
   ZMIENNE
   ========================================================= */

let scans = [];

let scanner = null;

let cameraRunning = false;
let cameraStream = null;
let barcodeReader = null;

let acceptingScan = false;

let processingScan = false;

let lastDetectedCode = '';

let lastDetectedTime = 0;

let currentAddress = null;

let currentUser = null;


/* =========================================================
   SKRÓT
   ========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   API JSONP
   ========================================================= */

function api(
    action,
    params = {}
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {


            const callback =
                'wms_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() *
                    100000
                );


            const script =
                document.createElement(
                    'script'
                );


            const query =
                new URLSearchParams();


            query.set(
                'action',
                action
            );


            query.set(
                'callback',
                callback
            );


            Object.keys(
                params
            ).forEach(
                key => {

                    if (
                        params[key] !==
                        undefined &&
                        params[key] !==
                        null
                    ) {

                        query.set(
                            key,
                            String(
                                params[key]
                            )
                        );

                    }

                }
            );


            let finished =
                false;


            const cleanup =
                () => {

                    if (
                        finished
                    ) {

                        return;

                    }


                    finished =
                        true;


                    delete window[
                        callback
                    ];


                    script.remove();

                };


            const timeout =
                setTimeout(
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                'Brak odpowiedzi serwera.'
                            )
                        );

                    },
                    15000
                );


            window[callback] =
                data => {

                    clearTimeout(
                        timeout
                    );


                    cleanup();


                    if (
                        data &&
                        data.ok === false
                    ) {

                        reject(
                            new Error(
                                data.message ||
                                'Błąd serwera.'
                            )
                        );

                        return;

                    }


                    resolve(
                        data
                    );

                };


            script.onerror =
                () => {

                    clearTimeout(
                        timeout
                    );


                    cleanup();


                    reject(
                        new Error(
                            'Brak połączenia z Google Apps Script.'
                        )
                    );

                };


            script.src =
                API_URL +
                '?' +
                query.toString();


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   SESJA
   ========================================================= */

function getToken() {

    return sessionStorage.getItem(
        'wms_token'
    );

}


function getLogin() {

    return sessionStorage.getItem(
        'wms_login'
    );

}


function getRole() {

    return String(
        sessionStorage.getItem(
            'wms_role'
        ) || ''
    )
    .trim()
    .toUpperCase();

}


function clearSession() {

    sessionStorage.removeItem(
        'wms_token'
    );

    sessionStorage.removeItem(
        'wms_login'
    );

    sessionStorage.removeItem(
        'wms_role'
    );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function performLogin() {


    const login =
        $('loginInput')
            .value
            .trim();


    const password =
        $('passwordInput')
            .value;


    const button =
        $('loginButton');


    const message =
        $('loginMessage');


    if (
        !login ||
        !password
    ) {

        message.textContent =
            'Podaj login i hasło.';

        return;

    }


    button.disabled =
        true;


    button.textContent =
        'LOGOWANIE...';


    message.textContent =
        '';


    try {


        const result =
            await api(
                'login',
                {

                    login:
                        login,

                    password:
                        password

                }
            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result.message ||
                'Błąd logowania.'
            );

        }


        sessionStorage.setItem(
            'wms_token',
            result.token
        );


        sessionStorage.setItem(
            'wms_login',
            result.login
        );


        sessionStorage.setItem(
            'wms_role',
            String(
                result.role
            )
            .toUpperCase()
        );


        currentUser = {

            login:
                result.login,

            role:
                String(
                    result.role
                )
                .toUpperCase(),

            token:
                result.token

        };


        $('passwordInput')
            .value =
            '';


        showLoggedIn();


    } catch (error) {


        message.textContent =
            error.message;


        button.disabled =
            false;


        button.textContent =
            'ZALOGUJ';

    }

}


/* =========================================================
   CHECK SESSION
   ========================================================= */

async function checkExistingSession() {


    const token =
        getToken();


    if (!token) {

        showLogin();

        return;

    }


    try {


        const result =
            await api(
                'checkSession',
                {
                    token:
                        token
                }
            );


        if (
            result &&
            result.loggedIn
        ) {


            const role =
                String(
                    result.role || ''
                )
                .toUpperCase();


            sessionStorage.setItem(
                'wms_login',
                result.login
            );


            sessionStorage.setItem(
                'wms_role',
                role
            );


            currentUser = {

                login:
                    result.login,

                role:
                    role,

                token:
                    token

            };


            showLoggedIn();


        } else {


            clearSession();

            showLogin();

        }


    } catch (error) {


        clearSession();

        showLogin();

    }

}


/* =========================================================
   LOGIN VIEW
   ========================================================= */

function showLogin() {


    stopScanner();


    hideAll();


    $('loginView')
        .classList
        .remove(
            'hidden'
        );


    $('loginButton')
        .disabled =
        false;


    $('loginButton')
        .textContent =
        'ZALOGUJ';


    setTimeout(
        () => {

            $('loginInput')
                .focus();

        },
        100
    );

}


/* =========================================================
   MAIN VIEW
   ========================================================= */

async function showLoggedIn() {


    $('loginView')
        .classList
        .add(
            'hidden'
        );


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );


    const role =
        String(
            currentUser.role
        )
        .toUpperCase();


    $('userInfo')
        .textContent =
        '👤 ' +
        currentUser.login +
        ' [' +
        role +
        ']';


    if (
        role === 'ADMIN'
    ) {

        $('adminBtn')
            .classList
            .remove(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'block';

    } else {

        $('adminBtn')
            .classList
            .add(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'none';

    }


    ensureCameraPreview();

    try {
        await loadData();
    } catch (error) {
        console.error('loadData:', error);
    }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {


    const token =
        getToken();


    stopScanner();


    try {

        if (token) {

            await api(
                'logout',
                {
                    token:
                        token
                }
            );

        }

    } catch (_) {}


    clearSession();


    scans = [];


    currentAddress =
        null;


    currentUser =
        null;


    $('counter')
        .textContent =
        '0';


    $('address')
        .textContent =
        'BRAK ADRESU';


    $('lastCode')
        .textContent =
        'Ostatni skan: -';


    showLogin();

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {


    setMessage(
        'Pobieranie danych...'
    );


    try {


        const result =
            await api(
                'getData',
                {
                    token:
                        getToken()
                }
            );


        scans =
            result.scans || [];


        updateCounter();


        const last =
            [...scans]
                .reverse()
                .find(
                    scan =>
                        scan.address
                );


        if (last) {

            currentAddress =
                last.address;


            $('address')
                .textContent =
                formatAddress(
                    last.address
                );

        }


        setMessage(
            'Gotowy'
        );

/* =========================================================
   ADDRESS
   ========================================================= */

function formatAddress(
    address
) {

    address =
        String(
            address || ''
        );


    if (
        address.length === 6
    ) {

        return (
            address.substring(
                0,
                3
            ) +
            ' ' +
            address.substring(
                3,
                6
            )
        );

    }


    return address;

}


function validAddress(
    address
) {

    if (
        !/^\d{6}$/.test(
            address
        )
    ) {

        return false;

    }


    const col =
        Number(
            address.substring(
                0,
                3
            )
        );


    const place =
        Number(
            address.substring(
                3,
                6
            )
        );


    return (

        col >= 601 &&
        col <= 614 &&
        place >= 1 &&
        place <= 107

    );

}

/* =========================================================
   BEEP
   ========================================================= */

function beep() {


    try {


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (
            !AudioContext
        ) {

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.08;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.stop();

                context.close();

            },
            120
        );


    } catch (_) {}

}

/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner() {

    if (!getToken()) {
        showLogin();
        return false;
    }

    if (cameraRunning && cameraStream) {
        return true;
    }

    const reader = $('reader');
    const video = $('cameraVideo');

    try {

        if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('Brak obsługi kamery.');
        }

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: 'environment'
                    },
                    width: {
                        ideal: 1920
                    },
                    height: {
                        ideal: 1080
                    }
                },
                audio: false
            });

        video.srcObject = cameraStream;

        await video.play();

        cameraRunning = true;

        // Podgląd pozostaje cały czas widoczny.
        reader.style.display = 'block';

        return true;

    } catch (error) {

        console.error(error);

        stopScanner();

        alert(
            'Nie udało się uruchomić aparatu.\n\n' +
            'Sprawdź uprawnienia aparatu i HTTPS.'
        );

        return false;
    }
}


async function ensureCameraPreview() {

    if (!getToken()) return;

    if (cameraRunning && cameraStream) return;

    await startScanner();
}


/* =========================================================
   SKANUJ KOD
   DWA SZYBKIE, KOLEJNE ODCZYTY
   QR + KODY KRESKOWE 1D
   ========================================================= */

async function armScan() {

    if (processingScan) return;

    processingScan = true;
    acceptingScan = false;

    const button = $('scanBtn');

    button.disabled = true;

    try {

        const started = await startScanner();

        if (!started) {
            throw new Error('Brak kamery.');
        }

        // Pierwszy odczyt.
        const first =
            await decodeBarcodeFast(
                $('cameraVideo'),
                3500
            );

        // Prawie natychmiast drugi odczyt.
        await wait(100);

        const second =
            await decodeBarcodeFast(
                $('cameraVideo'),
                3500
            );

        /*
         * Zapis tylko wtedy, gdy oba odczyty są
         * identyczne i niepuste.
         */
        if (
            first &&
            second &&
            first === second
        ) {

            $('lastCode').textContent =
                'Ostatni skan: ' + second;

            await processAcceptedCode(second);

        } else {

            $('lastCode').textContent =
                'Ostatni skan: -';

            setMessage(
                'Skan niepoprawny, powtórz skan'
            );

            processingScan = false;
            acceptingScan = false;
            button.disabled = false;
        }

    } catch (error) {

        console.error(error);

        setMessage(
            'Skan niepoprawny, powtórz skan'
        );

        processingScan = false;
        acceptingScan = false;
        button.disabled = false;
    }
}


/* =========================================================
   SZYBKI ODCZYT
   Najpierw natywny BarcodeDetector, potem ZXing.
   BarcodeDetector dobrze radzi sobie z EAN/UPC/Code128/QR.
   ========================================================= */

async function decodeBarcodeFast(video, timeoutMs) {

    if (!video || video.readyState < 2) {
        return null;
    }

    if (typeof ZXingBrowser === 'undefined') {
        console.error('ZXing nie został załadowany.');
        return null;
    }

    if (!barcodeReader) {
        barcodeReader =
            new ZXingBrowser.BrowserMultiFormatReader();
    }

    /*
     * Nie próbujemy dekodować jednej przypadkowej klatki.
     * ZXing obserwuje obraz kamery aż znajdzie kod.
     * To jest dużo skuteczniejsze dla EAN/Code128 niż
     * pojedyncze zdjęcie.
     */
    return await new Promise(resolve => {

        let done = false;

        const finish = value => {

            if (done) return;

            done = true;

            try {
                barcodeReader.reset();
            } catch (_) {}

            if (timer) {
                clearTimeout(timer);
            }

            resolve(
                value
                    ? String(value).trim()
                    : null
            );
        };

        const timer =
            setTimeout(
                () => finish(null),
                timeoutMs
            );

        try {

            barcodeReader.decodeFromVideoElement(
                video,
                (result, error) => {

                    if (
                        result &&
                        result.text
                    ) {

                        finish(
                            result.text
                        );
                    }
                }
            );

        } catch (error) {

            console.error(
                'ZXing error:',
                error
            );

            finish(null);
        }
    });
}


function wait(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}


/* =========================================================
   SAVE SCAN
   ========================================================= */

async function processAcceptedCode(code) {

    if (!code) {

        setMessage(
            'Skan niepoprawny, powtórz skan'
        );

        processingScan = false;
        acceptingScan = false;
        $('scanBtn').disabled = false;

        return;
    }

    if (
        scans.some(
            scan =>
                !scan.deleted &&
                String(scan.code) === String(code)
        )
    ) {

        setMessage(
            'Skan niepoprawny, powtórz skan'
        );

        processingScan = false;
        acceptingScan = false;
        $('scanBtn').disabled = false;

        return;
    }

    const scan = {

        id:
            (
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : String(Date.now()) +
                      Math.random()
            ),

        code: String(code),

        address: null,

        date: Date.now(),

        deleted: false
    };

    try {

        const result =
            await api(
                'saveScan',
                {
                    token: getToken(),
                    id: scan.id,
                    code: scan.code,
                    address: null,
                    date: scan.date
                }
            );

        if (
            !result ||
            !result.ok
        ) {
            throw new Error(
                result.message ||
                'Błąd zapisu.'
            );
        }

        scans.push(scan);

        updateCounter();

        $('lastCode').textContent =
            'Ostatni skan: ' + code;

        beep();
        vibrateSuccess();

        setMessage('Zapisano');

    } catch (error) {

        console.error(error);

        if (isSessionError(error)) {
            clearSession();
            showLogin();
            return;
        }

        setMessage(
            'Skan niepoprawny, powtórz skan'
        );
    }

    processingScan = false;
    acceptingScan = false;

    $('scanBtn').disabled = false;
}


/* =========================================================
   KAMERA
   NIE WYŁĄCZAMY JEJ PO SKANIE
   ========================================================= */

function stopScanner() {

    acceptingScan = false;

    if (cameraStream) {

        cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        cameraStream = null;
    }

    const video =
        $('cameraVideo');

    if (video) {

        video.pause();
        video.srcObject = null;
    }

    cameraRunning = false;

    const reader =
        $('reader');

    if (reader) {
        reader.style.display = 'none';
    }
}

/* =========================================================
   PREVIEW
   ========================================================= */

function showPreview() {


    stopScanner();


    hideAll();


    $('previewView')
        .classList
        .remove(
            'hidden'
        );


    const groups = {};


    scans.forEach(
        scan => {

            const key =
                scan.address ||
                'BEZ ADRESU';


            if (
                !groups[key]
            ) {

                groups[key] =
                    [];

            }


            groups[key].push(
                scan
            );

        }
    );


    const keys =
        Object.keys(
            groups
        ).sort();


    const container =
        $('previewContainer');


    container.innerHTML =
        '';


    if (
        !keys.length
    ) {

        container.innerHTML =
            '<div class="card">' +
            'BRAK ZAPISANYCH SKANÓW' +
            '</div>';

        return;

    }


    keys.forEach(
        address => {


            const header =
                document.createElement(
                    'div'
                );


            header.className =
                'card-head';


            header.textContent =
                formatAddress(
                    address
                ) +
                ' — ' +
                groups[address].length;


            container.appendChild(
                header
            );


            groups[address].forEach(
                scan => {


                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    const code =
                        document.createElement(
                            'div'
                        );


                    code.className =
                        'card-code';


                    code.textContent =
                        scan.code;


                    const addr =
                        document.createElement(
                            'div'
                        );


                    addr.className =
                        'card-address';


                    addr.textContent =

                        scan.address
                            ?
                            'Adres: ' +
                            formatAddress(
                                scan.address
                            )
                            :
                            'Adres: OCZEKUJE NA ADRES';


                    const buttons =
                        document.createElement(
                            'div'
                        );


                    buttons.className =
                        'row-buttons';


                    const edit =
                        document.createElement(
                            'button'
                        );


                    edit.textContent =
                        'EDYTUJ';


                    edit.onclick =
                        () =>
                            editScan(
                                scan
                            );


                    buttons.appendChild(
                        edit
                    );


                    if (
                        getRole() ===
                        'ADMIN'
                    ) {


                        const del =
                            document.createElement(
                                'button'
                            );


                        del.textContent =
                            'USUŃ';


                        del.className =
                            'danger';


                        del.onclick =
                            () =>
                                deleteScanConfirm(
                                    scan
                                );


                        buttons.appendChild(
                            del
                        );

                    }


                    card.append(
                        code,
                        addr,
                        buttons
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }
    );

}

async function saveEdit(
    scan
) {


    const code =
        $('editCode')
            .value
            .trim();


    const address =
        $('editAddress')
            .value
            .trim();


    if (!code) {

        alert(
            'Wpisz kod.'

        return;

    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Nieprawidłowy adres.'

        return;

    }


    try {


        const result =
            await api(

                'updateScan',

                    token:
                        getToken(),

                    code:
                        code,

                    address:
                        address

                }

            );


        if (
            !result.ok
        ) {

            throw new Error(
                result.message
            );

        }


        const local =
            scans.find(
                item =>
                    item.id ===
                    scan.id
            );


        if (local) {

            local.code =
                code;

            local.address =
                address;

        if (
            isSessionError(
                error

        );

            'Pobieranie użytkowników...' +
            '</div>';


        const result =
            await api(

                'getUsers',

                {

                    token:
                        getToken()

                }

            );


        const users =
            result.users || [];


        let html =
            '<div class="card-head">' +
            'UŻYTKOWNICY' +
            '</div>';


        users.forEach(
            user => {


                const status =
                    user.active
                        ?
                        'AKTYWNY'
                        :
                        'NIEAKTYWNY';


                html +=

                    '<div class="card">' +

                    '<div class="card-code">' +

                    escapeHtml(
                        user.login
                    ) +

                    '</div>' +

                    '<div>' +

                    'Rola: ' +

                    escapeHtml(
                        user.role
                    ) +

                    '</div>' +

                    '<div>' +

                    'Status: ' +

                    status +

                    '</div>' +

                    '<div class="row-buttons">' +

                    '<button onclick="showEditUserDialog(\'' +
                    escapeJs(
                        user.login
                    ) +
                    '\')">' +

                    'EDYTUJ' +

                    '</button>' +

                    (
                        user.active
                            ?
                            '<button class="danger" onclick="disableUser(\'' +
                            escapeJs(
                                user.login
                            ) +
                            '\')">DEZAKTYWUJ</button>'
                            :
                            ''
                    ) +

                    '</div>' +

                    '</div>';

            }
        );


        $('adminContent')
            .innerHTML =
            html;


    } catch (error) {


        $('adminContent')
            .innerHTML =
            '<div class="card">' +
            'BŁĄD: ' +
            escapeHtml(
                error.message
            ) +
            '</div>';

    }

}


/* =========================================================
   CREATE USER
   ========================================================= */

function showCreateUserDialog() {


    if (
        getRole() !==
        'ADMIN'
    ) {

        return;

    }


    openDialog(

        'DODAJ UŻYTKOWNIKA',

        '<input id="newUserLogin" ' +
        'placeholder="Login">' +

        '<br><br>' +

        '<input id="newUserPassword" ' +
        'type="password" ' +
        'placeholder="Hasło">' +

        '<br><br>' +

        '<select id="newUserRole" ' +
        'style="width:100%;min-height:48px;font-size:18px">' +

        '<option value="OPERATOR">OPERATOR</option>' +

        '<option value="ADMIN">ADMIN</option>' +

        '</select>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'UTWÓRZ',
                createUser
            ]

        ]

    );

}


async function createUser() {


    const login =
        $('newUserLogin')
            .value
            .trim();


    const password =
        $('newUserPassword')
            .value;


    const role =
        $('newUserRole')
            .value;


    if (
        !login ||
        !password
    ) {

        alert(
            'Podaj login i hasło.'
        );

        return;

    }


    try {


        await api(

            'createUser',

            {

                token:
                    getToken(),

                login:
                    login,

                password:
                    password,

                role:
                    role

            }

        );


        closeDialog();


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   EDIT USER
   ========================================================= */

function showEditUserDialog(
    login
) {


    openDialog(

        'EDYTUJ UŻYTKOWNIKA',

        '<p>Login: <b>' +
        escapeHtml(
            login
        ) +
        '</b></p>' +

        '<input id="editUserPassword" ' +
        'type="password" ' +
        'placeholder="Nowe hasło — opcjonalnie">' +

        '<br><br>' +

        '<select id="editUserRole" ' +
        'style="width:100%;min-height:48px;font-size:18px">' +

        '<option value="OPERATOR">OPERATOR</option>' +

        '<option value="ADMIN">ADMIN</option>' +

        '</select>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'ZAPISZ',
                () =>
                    updateUser(
                        login
                    )
            ]

        ]

    );

}


async function updateUser(
    login
) {


    const password =
        $('editUserPassword')
            .value;


    const role =
        $('editUserRole')
            .value;


    try {


        await api(

            'updateUser',

            {

                token:
                    getToken(),

                login:
                    login,

                password:
                    password,

                role:
                    role

            }

        );


        closeDialog();


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   DISABLE USER
   ========================================================= */

async function disableUser(
    login
) {


    if (
        !confirm(
            'Dezaktywować użytkownika "' +
            login +
            '"?'
        )
    ) {

        return;

    }


    try {


        await api(

            'disableUser',

            {

                token:
                    getToken(),

                login:
                    login

            }

        );


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function hideAll() {


    [

        'mainView',
        'previewView',
        'searchView',
        'googleView',
        'adminView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );

}


function showMain() {


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );

}


/* =========================================================
   MODAL
   ========================================================= */

function openDialog(
    title,
    body,
    buttons
) {


    $('dialogTitle')
        .textContent =
        title;


    $('dialogBody')
        .innerHTML =
        body;


    const box =
        $('dialogButtons');


    box.innerHTML =
        '';


    buttons.forEach(
        item => {


            const button =
                document.createElement(
                    'button'
                );


            button.textContent =
                item[0];


            button.onclick =
                item[1];


            box.appendChild(
                button
            );

        }
    );


    $('modal')
        .classList
        .remove(
            'hidden'
        );

}


function closeDialog() {


    $('modal')
        .classList
        .add(
            'hidden'
        );

}


/* =========================================================
   ERRORS
   ========================================================= */

function isSessionError(
    error
) {


    const message =
        error &&
        error.message
            ?
            error.message
            :
            '';


    return message
        .toUpperCase()
        .includes(
            'SESJA'
        );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    value
) {

    return String(
        value || ''
    )

    .replaceAll(
        '&',
        '&amp;'
    )

    .replaceAll(
        '<',
        '&lt;'
    )

    .replaceAll(
        '>',
        '&gt;'
    )

    .replaceAll(
        '"',
        '&quot;'
    )

    .replaceAll(
        "'",
        '&#039;'
    );

}


function escapeJs(
    value
) {

    return String(
        value || ''
    )
    .replaceAll(
        '\\',
        '\\\\'
    )
    .replaceAll(
        "'",
        "\\'"
    );

}

        }

    .addEventListener(

                event.key ===
                'Enter'
            ) {

                performLogin();

            }

        }
    );


$('searchInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===

        }
    );

    }
);
