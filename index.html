<script>

/* =========================================================
   API
   ========================================================= */

const API_URL =
    'https://script.google.com/macros/s/AKfycbwd2-sYSpIw0N_MUo5xMSH7IHDSBX8Jtx4YznnlWr33CihUXiax6CQAIPD3r6Arr74dvw/exec';


/* =========================================================
   ZMIENNE
   ========================================================= */

let scans = [];

let scanner = null;

let cameraRunning = false;

let acceptingScan = false;

let processingScan = false;

let lastDetectedCode = '';

let lastDetectedTime = 0;

let currentAddress = null;

let currentUser = null;


/* =========================================================
   SKRÓT
   ========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   API JSONP
   ========================================================= */

function api(
    action,
    params = {}
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {


            const callback =
                'wms_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() *
                    100000
                );


            const script =
                document.createElement(
                    'script'
                );


            const query =
                new URLSearchParams();


            query.set(
                'action',
                action
            );


            query.set(
                'callback',
                callback
            );


            Object.keys(
                params
            ).forEach(
                key => {

                    if (
                        params[key] !==
                        undefined &&
                        params[key] !==
                        null
                    ) {

                        query.set(
                            key,
                            String(
                                params[key]
                            )
                        );

                    }

                }
            );


            let finished =
                false;


            const cleanup =
                () => {

                    if (
                        finished
                    ) {

                        return;

                    }


                    finished =
                        true;


                    delete window[
                        callback
                    ];


                    script.remove();

                };


            const timeout =
                setTimeout(
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                'Brak odpowiedzi serwera.'
                            )
                        );

                    },
                    15000
                );


            window[callback] =
                data => {

                    clearTimeout(
                        timeout
                    );


                    cleanup();


                    if (
                        data &&
                        data.ok === false
                    ) {

                        reject(
                            new Error(
                                data.message ||
                                'Błąd serwera.'
                            )
                        );

                        return;

                    }


                    resolve(
                        data
                    );

                };


            script.onerror =
                () => {

                    clearTimeout(
                        timeout
                    );


                    cleanup();


                    reject(
                        new Error(
                            'Brak połączenia z Google Apps Script.'
                        )
                    );

                };


            script.src =
                API_URL +
                '?' +
                query.toString();


            document.body.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   SESJA
   ========================================================= */

function getToken() {

    return sessionStorage.getItem(
        'wms_token'
    );

}


function getLogin() {

    return sessionStorage.getItem(
        'wms_login'
    );

}


function getRole() {

    return String(
        sessionStorage.getItem(
            'wms_role'
        ) || ''
    )
    .trim()
    .toUpperCase();

}


function clearSession() {

    sessionStorage.removeItem(
        'wms_token'
    );

    sessionStorage.removeItem(
        'wms_login'
    );

    sessionStorage.removeItem(
        'wms_role'
    );

}


/* =========================================================
   LOGIN
   ========================================================= */

async function performLogin() {


    const login =
        $('loginInput')
            .value
            .trim();


    const password =
        $('passwordInput')
            .value;


    const button =
        $('loginButton');


    const message =
        $('loginMessage');


    if (
        !login ||
        !password
    ) {

        message.textContent =
            'Podaj login i hasło.';

        return;

    }


    button.disabled =
        true;


    button.textContent =
        'LOGOWANIE...';


    message.textContent =
        '';


    try {


        const result =
            await api(
                'login',
                {

                    login:
                        login,

                    password:
                        password

                }
            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result.message ||
                'Błąd logowania.'
            );

        }


        sessionStorage.setItem(
            'wms_token',
            result.token
        );


        sessionStorage.setItem(
            'wms_login',
            result.login
        );


        sessionStorage.setItem(
            'wms_role',
            String(
                result.role
            )
            .toUpperCase()
        );


        currentUser = {

            login:
                result.login,

            role:
                String(
                    result.role
                )
                .toUpperCase(),

            token:
                result.token

        };


        $('passwordInput')
            .value =
            '';


        showLoggedIn();


    } catch (error) {


        message.textContent =
            error.message;


        button.disabled =
            false;


        button.textContent =
            'ZALOGUJ';

    }

}


/* =========================================================
   CHECK SESSION
   ========================================================= */

async function checkExistingSession() {


    const token =
        getToken();


    if (!token) {

        showLogin();

        return;

    }


    try {


        const result =
            await api(
                'checkSession',
                {
                    token:
                        token
                }
            );


        if (
            result &&
            result.loggedIn
        ) {


            const role =
                String(
                    result.role || ''
                )
                .toUpperCase();


            sessionStorage.setItem(
                'wms_login',
                result.login
            );


            sessionStorage.setItem(
                'wms_role',
                role
            );


            currentUser = {

                login:
                    result.login,

                role:
                    role,

                token:
                    token

            };


            showLoggedIn();


        } else {


            clearSession();

            showLogin();

        }


    } catch (error) {


        clearSession();

        showLogin();

    }

}


/* =========================================================
   LOGIN VIEW
   ========================================================= */

function showLogin() {


    stopScanner();


    hideAll();


    $('loginView')
        .classList
        .remove(
            'hidden'
        );


    $('loginButton')
        .disabled =
        false;


    $('loginButton')
        .textContent =
        'ZALOGUJ';


    setTimeout(
        () => {

            $('loginInput')
                .focus();

        },
        100
    );

}


/* =========================================================
   MAIN VIEW
   ========================================================= */

async function showLoggedIn() {


    $('loginView')
        .classList
        .add(
            'hidden'
        );


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );


    const role =
        String(
            currentUser.role
        )
        .toUpperCase();


    $('userInfo')
        .textContent =
        '👤 ' +
        currentUser.login +
        ' [' +
        role +
        ']';


    if (
        role === 'ADMIN'
    ) {

        $('adminBtn')
            .classList
            .remove(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'block';

    } else {

        $('adminBtn')
            .classList
            .add(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'none';

    }


    await loadData();

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {


    const token =
        getToken();


    stopScanner();


    try {

        if (token) {

            await api(
                'logout',
                {
                    token:
                        token
                }
            );

        }

    } catch (_) {}


    clearSession();


    scans = [];


    currentAddress =
        null;


    currentUser =
        null;


    $('counter')
        .textContent =
        '0';


    $('address')
        .textContent =
        'BRAK ADRESU';


    $('lastCode')
        .textContent =
        'Ostatni skan: -';


    showLogin();

}


/* =========================================================
   LOAD DATA
   ========================================================= */

async function loadData() {


    setMessage(
        'Pobieranie danych...'
    );


    try {


        const result =
            await api(
                'getData',
                {
                    token:
                        getToken()
                }
            );


        scans =
            result.scans || [];


        updateCounter();


        const last =
            [...scans]
                .reverse()
                .find(
                    scan =>
                        scan.address
                );


        if (last) {

            currentAddress =
                last.address;


            $('address')
                .textContent =
                formatAddress(
                    last.address
                );

        }


        setMessage(

   COUNTER
   ========================================================= */

function updateCounter() {

        scans.filter(
            scan =>
                !scan.deleted

/* =========================================================
   ADDRESS
   ========================================================= */

function formatAddress(
    address
) {

    address =
        String(
            address || ''
        );


    if (
        address.length === 6
    ) {

        return (
            address.substring(
                0,
                3
            ) +
            ' ' +
            address.substring(
                3,
                6
            )
        );

    }


    return address;

}


function validAddress(
    address
) {

    if (
        !/^\d{6}$/.test(
            address
        )
    ) {

        return false;

    }


    const col =
        Number(
            address.substring(
                0,
                3
            )
        );


    const place =
        Number(
            address.substring(
                3,
                6
            )
        );


    return (

        col >= 601 &&
        col <= 614 &&
        place >= 1 &&
        place <= 107

    );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function setMessage(
    text
) {

    $('message')
        .textContent =
        text;

}


/* =========================================================
   BEEP
   ========================================================= */

function beep() {


    try {


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (
            !AudioContext
        ) {

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.08;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.stop();

                context.close();

            },
            120
        );


    } catch (_) {}

}


/* =========================================================
   VIBRATION
   ========================================================= */

function vibrateSuccess() {

    try {

        if (
            navigator.vibrate
        ) {

            navigator.vibrate(
                [
                    80,
                    40,
                    100
                ]
            );

        }

    } catch (_) {}

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function startScanner() {

    if (!getToken()) {
        showLogin();
        return;
    }

    if (cameraRunning) {
        setMessage('APARAT JUŻ DZIAŁA — NACIŚNIJ ZATRZYMAJ');
        return;
    }

    const scanBtn = $('scanBtn');
    const stopBtn = $('stopScanBtn');
    const reader = $('reader');
    const status = $('scannerStatus');

    scanBtn.disabled = true;
    reader.style.display = 'block';
    status.style.display = 'block';
    stopBtn.classList.remove('hidden');

    setMessage('Uruchamianie aparatu...');

    try {
        if (typeof Html5Qrcode === 'undefined') {
            throw new Error('Skaner jeszcze się ładuje. Odczekaj chwilę i spróbuj ponownie.');
        }

        // Clean up any old instance.
        if (scanner) {
            try { await scanner.stop(); } catch (_) {}
            try { scanner.clear(); } catch (_) {}
            scanner = null;
        }

        scanner = new Html5Qrcode('reader');

        await scanner.start(
            {
                facingMode: { ideal: 'environment' }
            },
            {
                fps: 10,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    const width = Math.min(320, Math.floor(viewfinderWidth * 0.82));
                    const height = Math.min(220, Math.floor(viewfinderHeight * 0.55));
                    return { width: width, height: height };
                },
                aspectRatio: 1.777
            },
            code => handleDetectedCode(code),
            () => {}
        );

        cameraRunning = true;
        acceptingScan = true;
        processingScan = false;

        // Two separate successful reads are required.
        window.scanCandidate = '';
        window.scanCandidateTime = 0;
        window.scanSecondRead = false;

        status.textContent = 'APARAT GOTOWY — NACIŚNIJ SKANUJ KOD';
        scanBtn.textContent = '📷 SKANUJ KOD';
        setMessage('Gotowy. Naciśnij „SKANUJ KOD”, aby wykonać 2 odczyty.');

    } catch (error) {
        console.error(error);
        stopScanner();

        setMessage('Nie udało się uruchomić aparatu.');

        alert(
            'Nie udało się uruchomić aparatu.\n\n' +
            'Sprawdź, czy GitHub ma dostęp do kamery i czy używasz HTTPS.'
        );
    }
}


/*
 * Ręczne rozpoczęcie właściwego skanowania.
 * Aparat może już być uruchomiony, ale dekoder niczego nie zapisuje,
 * dopóki użytkownik nie naciśnie tego przycisku.
 */
async function armScan() {

    if (!cameraRunning) {
        await startScanner();
    }

    if (!cameraRunning) return;

    acceptingScan = true;
    processingScan = false;

    window.scanCandidate = '';
    window.scanCandidateTime = 0;
    window.scanSecondRead = false;

    $('scanBtn').disabled = true;
    $('stopScanBtn').classList.remove('hidden');

    $('scannerStatus').textContent =
        'SKANOWANIE AKTYWNE — ODCZYT 1 Z 2';

    setMessage('Skieruj aparat na kod. Odczyt 1 z 2...');

}


/* =========================================================
   DETEKCJA KODU — 2 ODCZYTY
   ========================================================= */

function handleDetectedCode(code) {

    if (!cameraRunning || !acceptingScan || processingScan) {
        return;
    }

    code = String(code || '').trim();

    if (!code) return;

    const now = Date.now();

    // Ten sam callback może przyjść wiele razy z jednego obrazu.
    if (
        window.scanCandidate === code &&
        now - Number(window.scanCandidateTime || 0) < 700
    ) {
        return;
    }

    // ODCZYT 1
    if (!window.scanCandidate) {

        window.scanCandidate = code;
        window.scanCandidateTime = now;
        window.scanSecondRead = false;

        beep();
        vibrateSuccess();

        $('lastCode').textContent =
            'Odczyt 1/2: ' + code;

        $('scannerStatus').textContent =
            'ODCZYT 1/2 — PONOWNIE ODCZYTUJĘ...';

        setMessage(
            'Pierwszy odczyt: ' + code +
            '. Czekam na drugi odczyt...'
        );

        return;
    }

    // ODCZYT 2
    if (window.scanCandidate) {

        const first = String(window.scanCandidate);
        const second = code;

        // Krótki odstęp, żeby nie uznać tego samego pojedynczego
        // obrazu za drugi niezależny odczyt.
        if (now - Number(window.scanCandidateTime) < 350) {
            return;
        }

        window.scanSecondRead = true;
        acceptingScan = false;
        processingScan = true;

        $('scannerStatus').textContent = 'PORÓWNUJĘ ODCZYTY...';

        if (first === second) {

            beep();
            vibrateSuccess();

            $('lastCode').textContent =
                '✓ ZGODNY 2/2: ' + second;

            setMessage('DWA ODCZYTY ZGODNE — ZAPISYWANIE...');

            processAcceptedCode(second);

        } else {

            // NIGDY NIE ZAPISUJEMY przy niezgodności.
            $('lastCode').textContent =
                '✗ NIEZGODNOŚĆ: ' + first + ' / ' + second;

            $('scannerStatus').textContent =
                'NIEZGODNOŚĆ — POWTÓRZ SKANOWANIE';

            setMessage(
                '✗ KODY NIEZGODNE — NIC NIE ZAPISANO. POWTÓRZ SKANOWANIE.'
            );

            processingScan = false;
            acceptingScan = false;

            window.scanCandidate = '';
            window.scanCandidateTime = 0;
            window.scanSecondRead = false;

            // Ponownie uzbrajamy po krótkiej chwili.
            setTimeout(() => {
                if (!cameraRunning) return;

                acceptingScan = true;
                $('scanBtn').disabled = false;

                $('scannerStatus').textContent =
                    'APARAT GOTOWY — NACIŚNIJ SKANUJ KOD';

                setMessage('Gotowy do kolejnego skanowania.');
            }, 900);
        }
    }
}


/* =========================================================
   SAVE SCAN
   ========================================================= */

async function processAcceptedCode(code) {

    $('lastCode').textContent =
        'Odczytano 2/2: ' + code;

    setMessage('Zapisywanie...');

    if (
        scans.some(
            scan =>
                !scan.deleted &&
                String(scan.code) === code
        )
    ) {

        $('lastCode').textContent =
            'Kod już istnieje: ' + code;

        setMessage('KOD JUŻ ISTNIEJE — NIE ZAPISANO PONOWNIE');

        processingScan = false;
        acceptingScan = false;
        window.scanCandidate = '';

        setTimeout(() => {
            if (!cameraRunning) return;

            acceptingScan = true;
            $('scanBtn').disabled = false;
            $('scannerStatus').textContent =
                'APARAT GOTOWY — NACIŚNIJ SKANUJ KOD';
        }, 700);

        return;
    }

    const scan = {
        id:
            (
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : String(Date.now()) + Math.random()
            ),

        code: code,
        address: null,
        date: Date.now(),
        deleted: false
    };

    try {

        const result = await api(
            'saveScan',
            {
                token: getToken(),
                id: scan.id,
                code: scan.code,
                address: null,
                date: scan.date
            }
        );

        if (!result || !result.ok) {
            throw new Error(
                result.message || 'Błąd zapisu.'
            );
        }

        scans.push(scan);
        updateCounter();

        $('lastCode').textContent =
            '✓ ZAPISANO: ' + code;

        setMessage('✓ ZAPISANO — SKAN ZAKOŃCZONY');

        $('scannerStatus').textContent =
            'ZAPISANO. NACIŚNIJ SKANUJ KOD, ABY ZESKANOWAĆ NASTĘPNY.';

    } catch (error) {

        if (isSessionError(error)) {
            clearSession();
            showLogin();
            return;
        }

        setMessage(
            'BŁĄD ZAPISU: ' + error.message
        );

        $('scannerStatus').textContent =
            'BŁĄD — POWTÓRZ SKANOWANIE';
    }

    processingScan = false;
    acceptingScan = false;

    window.scanCandidate = '';
    window.scanCandidateTime = 0;
    window.scanSecondRead = false;

    $('scanBtn').disabled = false;
}


/* =========================================================
   STOP SCANNER
   ========================================================= */

function stopScanner() {

    acceptingScan = false;
    processingScan = false;

    window.scanCandidate = '';
    window.scanCandidateTime = 0;
    window.scanSecondRead = false;

    if (scanner) {

        scanner
            .stop()
            .catch(() => {})
            .finally(() => {

                try {
                    scanner.clear();
                } catch (_) {}

                scanner = null;
                finishScannerStop();
            });

    } else {

        finishScannerStop();
    }
}


function finishScannerStop() {

    cameraRunning = false;

    $('reader').style.display = 'none';
    $('scannerStatus').style.display = 'none';

    $('stopScanBtn')
        .classList
        .add('hidden');

    $('scanBtn').disabled = false;
    $('scanBtn').textContent = '📷 SKANUJ KOD';
}

/* =========================================================
   PREVIEW
   ========================================================= */

function showPreview() {


    stopScanner();


    hideAll();


    $('previewView')
        .classList
        .remove(
            'hidden'
        );


    const groups = {};


    scans.forEach(
        scan => {

            const key =
                scan.address ||
                'BEZ ADRESU';


            if (
                !groups[key]
            ) {

                groups[key] =
                    [];

            }


            groups[key].push(
                scan
            );

        }
    );


    const keys =
        Object.keys(
            groups
        ).sort();


    const container =
        $('previewContainer');


    container.innerHTML =
        '';


    if (
        !keys.length
    ) {

        container.innerHTML =
            '<div class="card">' +
            'BRAK ZAPISANYCH SKANÓW' +
            '</div>';

        return;

    }


    keys.forEach(
        address => {


            const header =
                document.createElement(
                    'div'
                );


            header.className =
                'card-head';


            header.textContent =
                formatAddress(
                    address
                ) +
                ' — ' +
                groups[address].length;


            container.appendChild(
                header
            );


            groups[address].forEach(
                scan => {


                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    const code =
                        document.createElement(
                            'div'
                        );


                    code.className =
                        'card-code';


                    code.textContent =
                        scan.code;


                    const addr =
                        document.createElement(
                            'div'
                        );


                    addr.className =
                        'card-address';


                    addr.textContent =

                        scan.address
                            ?
                            'Adres: ' +
                            formatAddress(
                                scan.address
                            )
                            :
                            'Adres: OCZEKUJE NA ADRES';


                    const buttons =
                        document.createElement(
                            'div'
                        );


                    buttons.className =
                        'row-buttons';


                    const edit =
                        document.createElement(
                            'button'
                        );


                    edit.textContent =
                        'EDYTUJ';


                    edit.onclick =
                        () =>
                            editScan(
                                scan
                            );


                    buttons.appendChild(
                        edit
                    );


                    if (
                        getRole() ===
                        'ADMIN'
                    ) {


                        const del =
                            document.createElement(
                                'button'
                            );


                        del.textContent =
                            'USUŃ';


                        del.className =
                            'danger';


                        del.onclick =
                            () =>
                                deleteScanConfirm(
                                    scan
                                );


                        buttons.appendChild(
                            del
                        );

                    }


                    card.append(
                        code,
                        addr,
                        buttons
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }
    );

}

async function saveEdit(
    scan
) {


    const code =
        $('editCode')
            .value
            .trim();


    const address =
        $('editAddress')
            .value
            .trim();


    if (!code) {

            address
        )
    ) {

        alert(
            'Nieprawidłowy adres.'

        const result =

                    address:
                        address

        ) {

            );

        $('adminContent')
            .innerHTML =
            '<div class="card">' +
            'Pobieranie historii...' +
            '</div>';


        const result =
            await api(

                'getHistory',

                {

                    token:
                        getToken()

                }

            );


        const history =
            result.history || [];


        if (
            !history.length
        ) {

            $('adminContent')
                .innerHTML =
                '<div class="card">' +
                'BRAK HISTORII' +
                '</div>';

            return;

        }


        let html =
            '<div class="card-head">' +
            'HISTORIA — ' +
            history.length +
            ' WPISÓW' +
            '</div>';


        history.forEach(
            item => {


                html +=

                    '<div class="history-item">' +

                    '<div class="history-action">' +

                    escapeHtml(
                        item.action
                    ) +

                    ' — ' +

                    escapeHtml(
                        item.login
                    ) +

                    '</div>' +

                    (
                        item.code
                            ?
                            '<div>Kod: ' +
                            escapeHtml(
                                item.code
                            ) +
                            '</div>'
                            :
                            ''
                    ) +

                    (
                        item.address
                            ?
                            '<div>Adres: ' +
                            escapeHtml(
                                formatAddress(
                                    item.address
                                )
                            ) +
                            '</div>'
                            :
                            ''
                    ) +

                    '<div class="history-date">' +

                    escapeHtml(
                        item.date
                    ) +

                    '</div>' +

                    '</div>';

            }
        );


        $('adminContent')
            .innerHTML =
            html;


    } catch (error) {


        $('adminContent')
            .innerHTML =
            '<div class="card">' +
            'BŁĄD: ' +
            escapeHtml(
                error.message
            ) +
            '</div>';

    }

}


/* =========================================================
   ADMIN USERS
   ========================================================= */

async function loadAdminUsers() {


    try {


        $('adminContent')
            .innerHTML =
            '<div class="card">' +
            'Pobieranie użytkowników...' +
            '</div>';


        const result =
            await api(

                'getUsers',

                {

                    token:
                        getToken()

                }

            );


        const users =
            result.users || [];


        let html =
            '<div class="card-head">' +
            'UŻYTKOWNICY' +
            '</div>';


        users.forEach(
            user => {


                const status =
                    user.active
                        ?
                        'AKTYWNY'
                        :
                        'NIEAKTYWNY';


                html +=

                    '<div class="card">' +

                    '<div class="card-code">' +

                    escapeHtml(
                        user.login
                    ) +

                    '</div>' +

                    '<div>' +

                    'Rola: ' +

                    escapeHtml(
                        user.role
                    ) +

                    '</div>' +

                    '<div>' +

                    'Status: ' +

                    status +

                    '</div>' +

                    '<div class="row-buttons">' +

                    '<button onclick="showEditUserDialog(\'' +
                    escapeJs(
                        user.login
                    ) +
                    '\')">' +

                    'EDYTUJ' +

                    '</button>' +

                    (
                        user.active
                            ?
                            '<button class="danger" onclick="disableUser(\'' +
                            escapeJs(
                                user.login
                            ) +
                            '\')">DEZAKTYWUJ</button>'
                            :
                            ''
                    ) +

                    '</div>' +

                    '</div>';

            }
        );


        $('adminContent')
            .innerHTML =
            html;


    } catch (error) {


        $('adminContent')
            .innerHTML =
            '<div class="card">' +
            'BŁĄD: ' +
            escapeHtml(
                error.message
            ) +
            '</div>';

    }

}


/* =========================================================
   CREATE USER
   ========================================================= */

function showCreateUserDialog() {


    if (
        getRole() !==
        'ADMIN'
    ) {

        return;

    }


    openDialog(

        'DODAJ UŻYTKOWNIKA',

        '<input id="newUserLogin" ' +
        'placeholder="Login">' +

        '<br><br>' +

        '<input id="newUserPassword" ' +
        'type="password" ' +
        'placeholder="Hasło">' +

        '<br><br>' +

        '<select id="newUserRole" ' +
        'style="width:100%;min-height:48px;font-size:18px">' +

        '<option value="OPERATOR">OPERATOR</option>' +

        '<option value="ADMIN">ADMIN</option>' +

        '</select>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'UTWÓRZ',
                createUser
            ]

        ]

    );

}


async function createUser() {


    const login =
        $('newUserLogin')
            .value
            .trim();


    const password =
        $('newUserPassword')
            .value;


    const role =
        $('newUserRole')
            .value;


    if (
        !login ||
        !password
    ) {

        alert(
            'Podaj login i hasło.'
        );

        return;

    }


    try {


        await api(

            'createUser',

            {

                token:
                    getToken(),

                login:
                    login,

                password:
                    password,

                role:
                    role

            }

        );


        closeDialog();


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   EDIT USER
   ========================================================= */

function showEditUserDialog(
    login
) {


    openDialog(

        'EDYTUJ UŻYTKOWNIKA',

        '<p>Login: <b>' +
        escapeHtml(
            login
        ) +
        '</b></p>' +

        '<input id="editUserPassword" ' +
        'type="password" ' +
        'placeholder="Nowe hasło — opcjonalnie">' +

        '<br><br>' +

        '<select id="editUserRole" ' +
        'style="width:100%;min-height:48px;font-size:18px">' +

        '<option value="OPERATOR">OPERATOR</option>' +

        '<option value="ADMIN">ADMIN</option>' +

        '</select>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'ZAPISZ',
                () =>
                    updateUser(
                        login
                    )
            ]

        ]

    );

}


async function updateUser(
    login
) {


    const password =
        $('editUserPassword')
            .value;


    const role =
        $('editUserRole')
            .value;


    try {


        await api(

            'updateUser',

            {

                token:
                    getToken(),

                login:
                    login,

                password:
                    password,

                role:
                    role

            }

        );


        closeDialog();


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   DISABLE USER
   ========================================================= */

async function disableUser(
    login
) {


    if (
        !confirm(
            'Dezaktywować użytkownika "' +
            login +
            '"?'
        )
    ) {

        return;

    }


    try {


        await api(

            'disableUser',

            {

                token:
                    getToken(),

                login:
                    login

            }

        );


        loadAdminUsers();


    } catch (error) {


        alert(
            error.message
        );

    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function hideAll() {


    [

        'mainView',
        'previewView',
        'searchView',
        'googleView',
        'adminView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );

}


function showMain() {


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );

}


/* =========================================================
   MODAL
   ========================================================= */

function openDialog(
    title,
    body,
    buttons
) {


    $('dialogTitle')
        .textContent =
        title;


    $('dialogBody')
        .innerHTML =
        body;


    const box =
        $('dialogButtons');


    box.innerHTML =
        '';


    buttons.forEach(
        item => {


            const button =
                document.createElement(
                    'button'
                );


            button.textContent =
                item[0];


            button.onclick =
                item[1];


            box.appendChild(
                button
            );

        }
    );


    $('modal')
        .classList
        .remove(
            'hidden'
        );

}


function closeDialog() {


    $('modal')
        .classList
        .add(
            'hidden'
        );

}


/* =========================================================
   ERRORS
   ========================================================= */

function isSessionError(
    error
) {


    const message =
        error &&
        error.message
            ?
            error.message
            :
            '';


    return message
        .toUpperCase()
        .includes(
            'SESJA'
        );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
    value
) {

    return String(
        value || ''
    )

    .replaceAll(
        '&',
        '&amp;'
    )

    .replaceAll(
        '<',
        '&lt;'
    )

    .replaceAll(
        '>',
        '&gt;'
    )

    .replaceAll(
        '"',
        '&quot;'
    )

    .replaceAll(
        "'",
        '&#039;'
    );

}


function escapeJs(
    value
) {

    return String(
        value || ''
    )
    .replaceAll(
        '\\',
        '\\\\'
    )
    .replaceAll(
        "'",
        "\\'"
    );

}

   EVENTS

$('loginButton')

$('logoutButton')
    .onclick =

$('scanBtn')

    stopScanner;


$('addressBtn')

    showAddressDialog;


$('previewBtn')
    .onclick =
    showPreview;


$('searchBtn')
    .onclick =
    showSearch;


$('googleBtn')
    .onclick =
    showGoogle;


$('adminBtn')

    showAdmin;


/* =========================================================
   ENTER LOGIN
   ========================================================= */

$('loginInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===
                'Enter'
            ) {

                $('passwordInput')
                    .focus();

            }

        }
    );


$('passwordInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===
                'Enter'
            ) {

                performLogin();

            }

        }
    );


$('searchInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===
                'Enter'
            ) {

                runSearch();

            }

        }
    );


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    'load',
    () => {

        checkExistingSession();

    }
);


window.addEventListener(
    'beforeunload',
    () => {

        stopScanner();

    }
);

</script>
