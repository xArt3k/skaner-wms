<!DOCTYPE html>
<html lang="pl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Podgląd WMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f5f5;
            color: #111;
        }


        .container {

            width: 100%;
            max-width: 700px;

            margin: 0 auto;
        }


        .card {

            background: white;

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 20px;

            margin-bottom: 15px;
        }


        h1 {

            margin: 0 0 5px;

            font-size: 26px;
        }


        .subtitle {

            color: #777;

            font-size: 14px;

            margin-bottom: 20px;
        }


        label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 6px;
        }


        input {

            width: 100%;

            height: 52px;

            padding: 10px 14px;

            border: 1px solid #aaa;

            border-radius: 6px;

            font-size: 20px;

            outline: none;
        }


        input:focus {

            border-color: #111;
        }


        button {

            width: 100%;

            height: 52px;

            margin-top: 10px;

            border: 0;

            border-radius: 6px;

            background: #111;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        button:active {

            transform: scale(.99);
        }


        .message {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;

            color: #666;
        }


        .result {

            border: 1px solid #ddd;

            border-radius: 7px;

            padding: 15px;

            margin-top: 10px;

            background: #fff;
        }


        .code {

            font-size: 20px;

            font-weight: bold;

            word-break: break-all;
        }


        .location {

            margin-top: 8px;

            font-size: 19px;

            font-weight: bold;
        }


        .count {

            margin-top: 15px;

            font-size: 14px;

            font-weight: bold;
        }


        .error {

            color: #b00020;

            font-weight: bold;
        }


        .loading {

            text-align: center;

            color: #666;

            padding: 15px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================================================
         NAGŁÓWEK
         ================================================ -->

    <div class="card">

        <h1>
            📦 PODGLĄD WMS
        </h1>

        <div class="subtitle">
            Tylko odczyt
        </div>


        <!-- ============================================
             WYSZUKIWANIE
             ============================================ -->

        <label for="searchInput">
            NUMER ETYKIETY
        </label>


        <input
            id="searchInput"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="np. 591"
        >


        <button
            id="searchButton"
        >
            🔎 SZUKAJ
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- ================================================
         WYNIKI
         ================================================ -->

    <div
        id="results"
        class="card"
    >

        <div class="message">
            Wpisz numer etykiety i kliknij SZUKAJ.
        </div>

    </div>


</div>



<script>


/* =====================================================
   PODGLĄD WMS
   =====================================================

   TEN ADRES TYLKO ODCZYTUJE DANE.

   Nie wykonujemy tutaj:
       save
       delete
       update

   Jedyna operacja:
       action=get

   ===================================================== */


const API_URL =
    "https://script.google.com/macros/s/AKfycbxtZOSSEPQhVpGVi2huYORDDFJwPcyXoIMINk-P43s_PZNMrBTSmhPeqytZUgWOlRCU2Q/exec";



/* =====================================================
   DANE
   ===================================================== */

let scans = [];



/* =====================================================
   ELEMENTY
   ===================================================== */

const searchInput =
    document.getElementById(
        "searchInput"
    );


const searchButton =
    document.getElementById(
        "searchButton"
    );


const results =
    document.getElementById(
        "results"
    );


const message =
    document.getElementById(
        "message"
    );



/* =====================================================
   BEZPIECZNY HTML
   ===================================================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}



/* =====================================================
   FORMAT LOKALIZACJI
   ===================================================== */

function formatAddress(
    address
) {

    const value =
        String(
            address || ""
        ).trim();


    /*
     * 601001
     * ↓
     * 601 001
     */

    if (
        /^\d{6}$/.test(
            value
        )
    ) {

        return (
            value.substring(
                0,
                3
            )

            +

            " "

            +

            value.substring(
                3,
                6
            )
        );
    }


    return value;
}



/* =====================================================
   POBIERANIE DANYCH
   ===================================================== */

async function loadData() {

    message.textContent =
        "Pobieranie danych...";


    try {

        /*
         * TYLKO GET
         *
         * Niczego nie zapisujemy.
         */

        const response =
            await fetch(
                API_URL +
                "?action=get",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Błąd połączenia z Google Apps Script."
            );
        }


        const data =
            await response.json();


        /*
         * PodgladSkaner.gs zwraca:
         *
         * {
         *     status: "OK",
         *     data: [...]
         * }
         */

        if (
            data.status !== "OK"
        ) {

            throw new Error(
                data.message ||
                "Błąd danych."
            );
        }


        scans =
            Array.isArray(
                data.data
            )
                ? data.data
                : [];


        message.textContent =
            "Dane aktualne.";


    } catch (error) {

        console.error(
            error
        );


        message.innerHTML =
            '<span class="error">' +
            'BŁĄD POŁĄCZENIA Z GOOGLE APPS SCRIPT' +
            '</span>';


        results.innerHTML =
            '<div class="message error">' +
            escapeHtml(
                error.message
            ) +
            '</div>';
    }
}



/* =====================================================
   SZUKANIE
   ===================================================== */

function searchLabel() {

    const text =
        searchInput
            .value
            .trim();


    if (!text) {

        results.innerHTML =
            '<div class="message">' +
            'Wpisz fragment numeru etykiety.' +
            '</div>';

        return;
    }


    /*
     * Szukamy fragmentu.
     *
     * Przykład:
     *
     * wpisujesz:
     * 591
     *
     * znajdzie:
     *
     * 5907078456591
     * 1591001234567
     * itd.
     */

    const found =
        scans.filter(
            scan => {

                const code =
                    String(
                        scan.code || ""
                    ).trim();


                return code
                    .toLowerCase()
                    .includes(
                        text.toLowerCase()
                    );
            }
        );


    if (
        found.length === 0
    ) {

        results.innerHTML =
            '<div class="message">' +
            'BRAK WYNIKÓW' +
            '</div>';

        return;
    }


    let html = "";


    html +=
        '<div class="count">' +
        'ZNALEZIONO: ' +
        found.length +
        '</div>';


    found.forEach(
        scan => {

            html +=
                '<div class="result">' +

                    '<div class="code">' +
                        escapeHtml(
                            scan.code
                        ) +
                    '</div>' +

                    '<div class="location">' +
                        escapeHtml(
                            formatAddress(
                                scan.address
                            )
                        ) +
                    '</div>' +

                '</div>';
        }
    );


    results.innerHTML =
        html;
}



/* =====================================================
   EVENTS
   ===================================================== */

searchButton.addEventListener(
    "click",
    searchLabel
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            searchLabel();
        }
    }
);



/* =====================================================
   START
   ===================================================== */

loadData();

</script>


</body>

</html>
