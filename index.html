<script>


/* =========================================================
   GOOGLE APPS SCRIPT
   ========================================================= */

const API_URL =
    'https://script.google.com/macros/s/AKfycbwd2-sYSpIw0N_MUo5xMSH7IHDSBX8Jtx4YznnlWr33CihUXiax6CQAIPD3r6Arr74dvw/exec';



/* =========================================================
   ZMIENNE
   ========================================================= */

let scans = [];

let scanner = null;

let cameraRunning = false;

let takingDoubleScan = false;

let firstCode = null;

let firstDetectionTime = 0;

let currentAddress = null;

let currentUser = null;



/* =========================================================
   ELEMENTY
   ========================================================= */

const $ = id =>
    document.getElementById(id);



/* =========================================================
   API
   ========================================================= */

function api(
    action,
    params = {}
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {


            const callback =
                'cb_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() *
                    100000
                );


            const script =
                document.createElement(
                    'script'
                );


            const query =
                new URLSearchParams();


            query.set(
                'action',
                action
            );


            query.set(
                'callback',
                callback
            );


            Object.keys(
                params
            ).forEach(
                key => {

                    if (
                        params[key] !==
                        undefined &&
                        params[key] !==
                        null
                    ) {

                        query.set(
                            key,
                            String(
                                params[key]
                            )
                        );

                    }

                }
            );


            let finished =
                false;


            const cleanup =
                () => {

                    if (
                        finished
                    ) {

                        return;

                    }


                    finished =
                        true;


                    try {

                        delete window[
                            callback
                        ];

                    } catch (_) {}


                    script.remove();

                };


            window[callback] =
                data => {

                    cleanup();


                    if (
                        data &&
                        data.ok === false
                    ) {

                        reject(
                            new Error(
                                data.message ||
                                'Błąd'
                            )
                        );

                        return;

                    }


                    resolve(
                        data
                    );

                };


            script.onerror =
                () => {

                    cleanup();


                    reject(
                        new Error(
                            'Brak połączenia z Google Apps Script.'
                        )
                    );

                };


            script.src =
                API_URL +
                '?' +
                query.toString();


            document.body.appendChild(
                script
            );


        }
    );

}



/* =========================================================
   SESJA — PAMIĘĆ
   ========================================================= */

function getToken() {

    return sessionStorage.getItem(
        'wms_token'
    );

}


function getLogin() {

    return sessionStorage.getItem(
        'wms_login'
    );

}


function getRole() {

    return sessionStorage.getItem(
        'wms_role'
    );

}



/* =========================================================
   LOGOWANIE
   ========================================================= */

async function performLogin() {


    const login =
        $('loginInput')
            .value
            .trim();


    const password =
        $('passwordInput')
            .value;


    const button =
        $('loginButton');


    const message =
        $('loginMessage');


    if (
        !login ||
        !password
    ) {

        message.textContent =
            'Podaj login i hasło.';

        return;

    }


    button.disabled =
        true;


    button.textContent =
        'LOGOWANIE...';


    message.textContent =
        '';


    try {


        const result =
            await api(
                'login',
                {
                    login:
                        login,

                    password:
                        password
                }
            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result &&
                result.message
                    ?
                    result.message
                    :
                    'Błąd logowania.'
            );

        }


        sessionStorage.setItem(
            'wms_token',
            result.token
        );


        sessionStorage.setItem(
            'wms_login',
            result.login
        );


        sessionStorage.setItem(
            'wms_role',
            result.role
        );


        currentUser = {

            login:
                result.login,

            role:
                result.role,

            token:
                result.token

        };


        showLoggedIn();


    } catch (error) {


        message.textContent =
            error.message ||
            'Błąd logowania.';


        button.disabled =
            false;


        button.textContent =
            'ZALOGUJ';

    }

}



/* =========================================================
   SPRAWDZENIE SESJI
   ========================================================= */

async function checkExistingSession() {


    const token =
        getToken();


    if (!token) {

        showLogin();

        return;

    }


    try {


        const result =
            await api(
                'checkSession',
                {
                    token:
                        token
                }
            );


        if (
            result &&
            result.loggedIn
        ) {


            currentUser = {

                login:
                    result.login,

                role:
                    result.role,

                token:
                    token

            };


            showLoggedIn();


        } else {

            clearSession();

            showLogin();

        }


    } catch (_) {

        clearSession();

        showLogin();

    }

}



/* =========================================================
   POKAZANIE LOGOWANIA
   ========================================================= */

function showLogin() {


    stopScanner();


    $('loginView')
        .classList
        .remove(
            'hidden'
        );


    $('mainView')
        .classList
        .add(
            'hidden'
        );


    [
        'previewView',
        'searchView',
        'googleView'
    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );


    $('loginInput')
        .focus();

}



/* =========================================================
   POKAZANIE APLIKACJI
   ========================================================= */

async function showLoggedIn() {


    $('loginView')
        .classList
        .add(
            'hidden'
        );


    $('mainView')
        .classList
        .remove(
            'hidden'
        );


    $('userInfo')
        .textContent =
        '👤 ' +
        currentUser.login +
        ' [' +
        currentUser.role +
        ']';


    /*
     * OPERATOR nie dostaje przycisku
     * backupu.
     */

    if (
        currentUser.role !==
        'ADMIN'
    ) {

        $('backupButton')
            .style
            .display =
            'none';

    } else {

        $('backupButton')
            .style
            .display =
            'block';

    }


    setMessage(
        'Pobieranie danych...'
    );


    await loadData();

}



/* =========================================================
   WYLOGOWANIE
   ========================================================= */

async function logout() {


    const token =
        getToken();


    stopScanner();


    try {

        if (token) {

            await api(
                'logout',
                {
                    token:
                        token
                }
            );

        }

    } catch (_) {}


    clearSession();

    scans = [];

    currentAddress = null;

    currentUser = null;


    $('counter')
        .textContent =
        '0';


    $('address')
        .textContent =
        'BRAK ADRESU';


    $('lastCode')
        .textContent =
        'Ostatni skan: -';


    showLogin();

}



/* =========================================================
   CZYSZCZENIE SESJI
   ========================================================= */

function clearSession() {

    sessionStorage.removeItem(
        'wms_token'
    );

    sessionStorage.removeItem(
        'wms_login'
    );

    sessionStorage.removeItem(
        'wms_role'
    );

}



/* =========================================================
   ADRES
   ========================================================= */

function formatAddress(
    address
) {


    address =
        String(
            address || ''
        );


    if (
        address.length === 6
    ) {

        return (
            address.slice(0,3) +
            ' ' +
            address.slice(3,6)
        );

    }


    return address;

}



/* =========================================================
   WALIDACJA ADRESU
   ========================================================= */

function validAddress(
    address
) {


    if (
        !/^\d{6}$/.test(
            address
        )
    ) {

        return false;

    }


    const column =
        Number(
            address.slice(
                0,
                3
            )
        );


    const place =
        Number(
            address.slice(
                3,
                6
            )
        );


    return (

        column >= 601 &&

        column <= 614 &&

        place >= 1 &&

        place <= 107

    );

}



/* =========================================================
   KOMUNIKAT
   ========================================================= */

function setMessage(
    text
) {

    $('message')
        .textContent =
        text;

}



/* =========================================================
   LICZNIK
   ========================================================= */

function updateCounter() {


    scans =
        scans.filter(
            scan =>
                !scan.deleted
        );


    $('counter')
        .textContent =
        scans.length;

}



/* =========================================================
   POBRANIE DANYCH
   ========================================================= */

async function loadData() {


    try {


        const result =
            await api(
                'getData',
                {
                    token:
                        getToken()
                }
            );


        scans =
            result.scans || [];


        updateCounter();


        const last =
            [...scans]
                .reverse()
                .find(
                    scan =>
                        scan.address
                );


        if (last) {

            currentAddress =
                last.address;


            $('address')
                .textContent =
                formatAddress(
                    last.address
                );

        }


        setMessage(
            'Gotowy'
        );


    } catch (error) {


        if (
            error.message
                .includes(
                    'SESJA'
                )
        ) {

            clearSession();

            showLogin();

            return;

        }


        setMessage(
            'BŁĄD: ' +
            error.message
        );

    }

}



/* =========================================================
   APARAT
   ========================================================= */

async function startScanner() {


    if (
        !getToken()
    ) {

        showLogin();

        return;

    }


    if (
        cameraRunning
    ) {

        beginDoubleCapture();

        return;

    }


    $('reader')
        .style
        .display =
        'block';


    setMessage(
        'Uruchamianie aparatu...'
    );


    try {


        if (
            typeof Html5Qrcode ===
            'undefined'
        ) {

            throw new Error(
                'Biblioteka skanera jeszcze się ładuje.'
            );

        }


        scanner =
            new Html5Qrcode(
                'reader'
            );


        await scanner.start(

            {
                facingMode:
                    'environment'
            },

            {

                fps: 10,

                qrbox: {

                    width: 280,

                    height: 180

                },

                aspectRatio:
                    1.777

            },

            decoded =>
                handleDetectedCode(
                    decoded
                ),

            () => {}

        );


        cameraRunning =
            true;


        setMessage(
            'Gotowy'
        );


        beginDoubleCapture();


    } catch (error) {


        stopScanner();


        setMessage(
            'Nie udało się uruchomić aparatu.'
        );


        alert(
            'Nie udało się uruchomić aparatu.\n\n' +
            'Sprawdź uprawnienie aparatu oraz HTTPS.'
        );

    }

}



/* =========================================================
   PODWÓJNY ODCZYT
   ========================================================= */

function beginDoubleCapture() {


    if (
        takingDoubleScan
    ) {

        return;

    }


    firstCode =
        null;


    firstDetectionTime =
        0;


    takingDoubleScan =
        true;


    $('scanBtn')
        .disabled =
        true;


    setMessage(
        'Skanowanie...'
    );

}



/* =========================================================
   ODCZYT KODU
   ========================================================= */

function handleDetectedCode(
    code
) {


    code =
        String(
            code || ''
        ).trim();


    if (
        !takingDoubleScan ||
        !code
    ) {

        return;

    }


    if (
        firstCode === null
    ) {

        firstCode =
            code;


        firstDetectionTime =
            Date.now();


        return;

    }


    if (
        Date.now() -
        firstDetectionTime <
        150
    ) {

        return;

    }


    const second =
        code;


    takingDoubleScan =
        false;


    if (
        firstCode ===
        second
    ) {

        processAcceptedCode(
            firstCode
        );

    } else {


        $('lastCode')
            .textContent =
            'Kod nie został zapisany';


        setMessage(
            'ROZBIEŻNOŚĆ — PONÓW SKAN'
        );


        firstCode =
            null;


        $('scanBtn')
            .disabled =
            false;

    }

}



/* =========================================================
   ZAPIS SKANU
   ========================================================= */

async function processAcceptedCode(
    code
) {


    firstCode =
        null;


    if (
        scans.some(
            scan =>
                !scan.deleted &&
                scan.code === code
        )
    ) {


        $('lastCode')
            .textContent =
            'Nie zapisano: ' +
            code;


        setMessage(
            'KOD JUŻ ISTNIEJE'
        );


        $('scanBtn')
            .disabled =
            false;


        return;

    }


    const scan = {

        id:
            (
                crypto.randomUUID
                    ?
                    crypto.randomUUID()
                    :
                    String(
                        Date.now()
                    ) +
                    Math.random()
            ),

        code:
            code,

        address:
            null,

        date:
            Date.now()

    };


    try {


        const result =
            await api(

                'saveScan',

                {

                    token:
                        getToken(),

                    id:
                        scan.id,

                    code:
                        scan.code,

                    address:
                        scan.address,

                    date:
                        scan.date

                }

            );


        if (
            !result.ok
        ) {

            setMessage(
                result.message ||
                'BŁĄD ZAPISU'
            );


            $('scanBtn')
                .disabled =
                false;


            return;

        }


        scans.push(
            scan
        );


        updateCounter();


        $('lastCode')
            .textContent =
            'Ostatni skan: ' +
            code;


        setMessage(
            'OK — OCZEKUJE NA ADRES'
        );


    } catch (error) {


        if (
            error.message
                .includes(
                    'SESJA'
                )
        ) {

            clearSession();

            showLogin();

            return;

        }


        setMessage(
            'BŁĄD ZAPISU: ' +
            error.message
        );

    }


    $('scanBtn')
        .disabled =
        false;

}



/* =========================================================
   ZATRZYMANIE APARATU
   ========================================================= */

function stopScanner() {


    if (scanner) {


        scanner
            .stop()
            .catch(
                () => {}
            )
            .finally(
                () => {

                    $('reader')
                        .style
                        .display =
                        'none';

                    cameraRunning =
                        false;

                    scanner =
                        null;

                }
            );


    } else {


        $('reader')
            .style
            .display =
            'none';


        cameraRunning =
            false;

    }


    takingDoubleScan =
        false;


    firstCode =
        null;


    firstDetectionTime =
        0;


    if (
        $('scanBtn')
    ) {

        $('scanBtn')
            .disabled =
            false;

    }

}



/* =========================================================
   ADRES — OKNO
   ========================================================= */

function showAddressDialog() {


    const pending =
        scans.filter(
            scan =>
                !scan.deleted &&
                !scan.address
        ).length;


    if (
        !pending
    ) {

        alert(
            'Brak kodów oczekujących na adres.'
        );


        return;

    }


    openDialog(

        'PODAJ ADRES',

        '<p>Oczekujących kodów: ' +
        pending +
        '</p>' +

        '<p>Zakres: 601001 – 614107</p>' +

        '<input ' +
        'id="addressInput" ' +
        'inputmode="numeric" ' +
        'maxlength="6" ' +
        'placeholder="np. 601001">',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'OK',
                assignAddressFromDialog
            ]

        ]

    );

}



/* =========================================================
   PRZYPISANIE ADRESU
   ========================================================= */

async function assignAddressFromDialog() {


    const address =
        $('addressInput')
            .value
            .trim();


    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Adres musi mieć format 601001 i zakres 601001–614107.'
        );


        return;

    }


    try {


        const result =
            await api(

                'assignAddress',

                {

                    token:
                        getToken(),

                    address:
                        address

                }

            );


        scans.forEach(
            scan => {

                if (
                    !scan.deleted &&
                    !scan.address
                ) {

                    scan.address =
                        address;

                }

            }
        );


        currentAddress =
            address;


        $('address')
            .textContent =
            formatAddress(
                address
            );


        $('lastCode')
            .textContent =
            'Przypisano ' +
            result.count +
            ' kodów';


        setMessage(
            '✓ ' +
            result.count +
            ' kodów zapisano w Google'
        );


        closeDialog();


    } catch (error) {


        if (
            error.message
                .includes(
                    'SESJA'
                )
        ) {

            clearSession();

            showLogin();

            return;

        }


        alert(
            error.message
        );

    }

}



/* =========================================================
   PODGLĄD
   ========================================================= */

function showPreview() {


    hideAll();


    $('previewView')
        .classList
        .remove(
            'hidden'
        );


    const groups = {};


    scans.forEach(
        scan => {

            const key =
                scan.address ||
                'BEZ ADRESU';


            if (
                !groups[key]
            ) {

                groups[key] =
                    [];

            }


            groups[key].push(
                scan
            );

        }
    );


    const keys =
        Object.keys(
            groups
        ).sort();


    const container =
        $('previewContainer');


    container.innerHTML =
        '';


    if (
        !keys.length
    ) {

        container.innerHTML =
            '<div class="card">' +
            'BRAK ZAPISANYCH SKANÓW' +
            '</div>';


        return;

    }


    keys.forEach(
        address => {


            const header =
                document.createElement(
                    'div'
                );


            header.className =
                'card-head';


            header.textContent =
                formatAddress(
                    address
                ) +
                ' — ' +
                groups[address].length;


            container.appendChild(
                header
            );


            groups[address].forEach(
                scan => {


                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    const code =
                        document.createElement(
                            'div'
                        );


                    code.className =
                        'card-code';


                    code.textContent =
                        scan.code;


                    const addressElement =
                        document.createElement(
                            'div'
                        );


                    addressElement.className =
                        'card-address';


                    addressElement.textContent =

                        scan.address
                            ?
                            'Adres: ' +
                            formatAddress(
                                scan.address
                            )
                            :
                            'Adres: OCZEKUJE NA ADRES';


                    const buttons =
                        document.createElement(
                            'div'
                        );


                    buttons.className =
                        'row-buttons';


                    const edit =
                        document.createElement(
                            'button'
                        );


                    edit.textContent =
                        'EDYTUJ';


                    edit.onclick =
                        () =>
                            editScan(
                                scan
                            );


                    const remove =
                        document.createElement(
                            'button'
                        );


                    remove.textContent =
                        'USUŃ';


                    remove.className =
                        'danger';


                    /*
                     * Tylko ADMIN może usuwać.
                     */

                    if (
                        getRole() !==
                        'ADMIN'
                    ) {

                        remove.style.display =
                            'none';

                    }


                    remove.onclick =
                        () =>
                            deleteScanConfirm(
                                scan
                            );


                    buttons.append(
                        edit,
                        remove
                    );


                    card.append(
                        code,
                        addressElement,
                        buttons
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }
    );

}



/* =========================================================
   EDYCJA
   ========================================================= */

function editScan(
    scan
) {


    openDialog(

        'EDYTUJ SKAN',

        '<input id="editCode" value="' +
        escapeHtml(
            scan.code
        ) +
        '" placeholder="Kod">' +

        '<br><br>' +

        '<input id="editAddress" ' +
        'inputmode="numeric" ' +
        'maxlength="6" ' +
        'value="' +
        escapeHtml(
            scan.address || ''
        ) +
        '" placeholder="Adres np. 601001">',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'ZAPISZ',
                () =>
                    saveEdit(
                        scan
                    )
            ]

        ]

    );

}



/* =========================================================
   ZAPIS EDYCJI
   ========================================================= */

async function saveEdit(
    scan
) {


    const code =
        $('editCode')
            .value
            .trim();


    const address =
        $('editAddress')
            .value
            .trim();


    if (!code) {

        alert(
            'Wpisz kod.'
        );


        return;

    }


    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Nieprawidłowy adres.'
        );


        return;

    }


    try {


        const result =
            await api(

                'updateScan',

                {

                    token:
                        getToken(),

                    id:
                        scan.id,

                    code:
                        code,

                    address:
                        address

                }

            );


        if (
            !result.ok
        ) {

            alert(
                result.message ||
                'Nie udało się zapisać.'
            );


            return;

        }


        const local =
            scans.find(
                item =>
                    item.id ===
                    scan.id
            );


        if (local) {

            local.code =
                code;

            local.address =
                address;

        }


        closeDialog();

        showPreview();

        setMessage(
            'Zapisano zmianę.'
        );


    } catch (error) {


        if (
            error.message
                .includes(
                    'SESJA'
                )
        ) {

            clearSession();

            showLogin();

            return;

        }


        alert(
            error.message
        );

    }

}



/* =========================================================
   USUWANIE
   ========================================================= */

function deleteScanConfirm(
    scan
) {


    if (
        getRole() !==
        'ADMIN'
    ) {

        alert(
            'Brak uprawnień.'
        );


        return;

    }


    openDialog(

        'USUŃ SKAN',

        '<p>Czy na pewno usunąć kod <b>' +
        escapeHtml(
            scan.code
        ) +
        '</b>?</p>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'USUŃ',
                () =>
                    performDelete(
                        scan
                    )
            ]

        ]

    );

}



/* =========================================================
   WYKONANIE USUNIĘCIA
   ========================================================= */

async function performDelete(
    scan
) {


    try {


        await api(

            'deleteScan',

            {

                token:
                    getToken(),

                id:
                    scan.id

            }

        );


        scans =
            scans.filter(
                item =>
                    item.id !==
                    scan.id
            );


        updateCounter();


        closeDialog();

        showPreview();

        setMessage(
            'Usunięto skan.'
        );


    } catch (error) {


        if (
            error.message
                .includes(
                    'SESJA'
                )
        ) {

            clearSession();

            showLogin();

            return;

        }


        alert(
            error.message
        );

    }

}



/* =========================================================
   SZUKANIE
   ========================================================= */

function showSearch() {


    hideAll();


    $('searchView')
        .classList
        .remove(
            'hidden'
        );


    $('searchInput')
        .focus();

}



/* =========================================================
   WYKONANIE SZUKANIA
   ========================================================= */

function runSearch() {


    const query =
        $('searchInput')
            .value
            .trim();


    if (!query) {

        $('searchResult')
            .textContent =
            'Wpisz fragment kodu i kliknij SZUKAJ.';


        return;

    }


    const results =
        scans.filter(
            scan =>
                scan.code
                    .toLowerCase()
                    .includes(
                        query.toLowerCase()
                    )
        );


    if (
        !results.length
    ) {

        $('searchResult')
            .textContent =
            'BRAK WYNIKU\n\n' +
            'Szukany fragment:\n' +
            query;


        return;

    }


    let html =
        '<div class="card">' +
        '<b>ZNALEZIONO: ' +
        results.length +
        '</b></div>';


    results.forEach(
        (
            scan,
            index
        ) => {


            html +=

                '<div class="card">' +

                '<div class="card-code">' +

                (
                    index + 1
                ) +

                '. ' +

                escapeHtml(
                    scan.code
                ) +

                '</div>' +

                '<div class="card-address">' +

                'ADRES: ' +

                (
                    scan.address
                        ?
                        escapeHtml(
                            formatAddress(
                                scan.address
                            )
                        )
                        :
                        'OCZEKUJE NA ADRES'
                ) +

                '</div>' +

                '</div>';

        }
    );


    $('searchResult')
        .innerHTML =
        html;

}



/* =========================================================
   GOOGLE
   ========================================================= */

function showGoogle() {


    hideAll();


    $('googleView')
        .classList
        .remove(
            'hidden'
        );

}



/* =========================================================
   PONOWNE POBRANIE
   ========================================================= */

async function reloadData() {


    $('googleStatus')
        .textContent =
        'Pobieranie...';


    await loadData();


    $('googleStatus')
        .textContent =
        'Dane pobrane.';

}



/* =========================================================
   BACKUP
   ========================================================= */

async function backupData() {


    if (
        getRole() !==
        'ADMIN'
    ) {

        $('googleStatus')
            .textContent =
            'BRAK UPRAWNIEŃ';

        return;

    }


    $('googleStatus')
        .textContent =
        'Tworzenie kopii...';


    try {


        const result =
            await api(

                'exportJson',

                {

                    token:
                        getToken()

                }

            );


        $('googleStatus')
            .textContent =
            'Utworzono: ' +
            result.name;


    } catch (error) {


        $('googleStatus')
            .textContent =
            'BŁĄD: ' +
            error.message;

    }

}



/* =========================================================
   NAWIGACJA
   ========================================================= */

function hideAll() {


    [

        'mainView',
        'previewView',
        'searchView',
        'googleView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );

}



/* =========================================================
   POWRÓT DO GŁÓWNEGO
   ========================================================= */

function showMain() {


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );

}



/* =========================================================
   MODAL
   ========================================================= */

function openDialog(
    title,
    body,
    buttons
) {


    $('dialogTitle')
        .textContent =
        title;


    $('dialogBody')
        .innerHTML =
        body;


    const box =
        $('dialogButtons');


    box.innerHTML =
        '';


    buttons.forEach(
        item => {


            const button =
                document.createElement(
                    'button'
                );


            button.textContent =
                item[0];


            button.onclick =
                item[1];


            box.appendChild(
                button
            );

        }
    );


    $('modal')
        .classList
        .remove(
            'hidden'
        );

}



/* =========================================================
   ZAMKNIĘCIE MODALA
   ========================================================= */

function closeDialog() {


    $('modal')
        .classList
        .add(
            'hidden'
        );

}



/* =========================================================
   OCHRONA HTML
   ========================================================= */

function escapeHtml(
    value
) {


    return String(
        value || ''
    )

    .replaceAll(
        '&',
        '&amp;'
    )

    .replaceAll(
        '<',
        '&lt;'
    )

    .replaceAll(
        '>',
        '&gt;'
    )

    .replaceAll(
        '"',
        '&quot;'
    )

    .replaceAll(
        "'",
        '&#039;'
    );

}



/* =========================================================
   PRZYCISKI
   ========================================================= */

$('loginButton')
    .onclick =
    performLogin;


$('logoutButton')
    .onclick =
    logout;


$('scanBtn')
    .onclick =
    startScanner;


$('addressBtn')
    .onclick =
    showAddressDialog;


$('previewBtn')
    .onclick =
    showPreview;


$('searchBtn')
    .onclick =
    showSearch;


$('googleBtn')
    .onclick =
    showGoogle;



/* =========================================================
   ENTER — LOGIN
   ========================================================= */

$('loginInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===
                'Enter'
            ) {

                $('passwordInput')
                    .focus();

            }

        }
    );


$('passwordInput')
    .addEventListener(
        'keydown',
        event => {

            if (
                event.key ===
                'Enter'
            ) {

                performLogin();

            }

        }
    );



/* =========================================================
   START APLIKACJI
   ========================================================= */

window.addEventListener(
    'load',
    () => {

        checkExistingSession();

    }
);


window.addEventListener(
    'beforeunload',
    stopScanner
);

</script>
