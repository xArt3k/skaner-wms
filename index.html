<script>

/* =========================================================
   KONFIGURACJA API
   ========================================================= */

const API_URL =
    'https://script.google.com/macros/s/AKfycbwd2-sYSpIw0N_MUo5xMSH7IHDSBX8Jtx4YznnlWr33CihUXiax6CQAIPD3r6Arr74dvw/exec';



/* =========================================================
   ZMIENNE
   ========================================================= */

let scans = [];

let scanner = null;

let cameraRunning = false;

let acceptingScan = false;

let processingScan = false;

let lastDetectedCode = '';

let lastDetectedTime = 0;

let currentAddress = null;

let currentUser = null;



/* =========================================================
   SKRÓT
   ========================================================= */

const $ = id =>
    document.getElementById(id);



/* =========================================================
   API
   ========================================================= */

function api(
    action,
    params = {}
) {

    return new Promise(
        (
            resolve,
            reject
        ) => {


            const callback =
                'cb_' +
                Date.now() +
                '_' +
                Math.floor(
                    Math.random() *
                    100000
                );


            const script =
                document.createElement(
                    'script'
                );


            const query =
                new URLSearchParams();


            query.set(
                'action',
                action
            );


            query.set(
                'callback',
                callback
            );


            Object.keys(
                params
            ).forEach(
                key => {

                    if (
                        params[key] !==
                        undefined &&
                        params[key] !==
                        null
                    ) {

                        query.set(
                            key,
                            String(
                                params[key]
                            )
                        );

                    }

                }
            );


            let finished =
                false;


            const cleanup =
                () => {

                    if (
                        finished
                    ) {

                        return;

                    }


                    finished =
                        true;


                    try {

                        delete window[
                            callback
                        ];

                    } catch (_) {}


                    script.remove();

                };


            const timer =
                setTimeout(
                    () => {

                        cleanup();

                        reject(
                            new Error(
                                'Przekroczono czas odpowiedzi serwera.'
                            )
                        );

                    },
                    15000
                );


            window[callback] =
                data => {

                    clearTimeout(
                        timer
                    );


                    cleanup();


                    if (
                        data &&
                        data.ok === false
                    ) {

                        reject(
                            new Error(
                                data.message ||
                                'Błąd'
                            )
                        );

                        return;

                    }


                    resolve(
                        data
                    );

                };


            script.onerror =
                () => {

                    clearTimeout(
                        timer
                    );


                    cleanup();


                    reject(
                        new Error(
                            'Brak połączenia z Google Apps Script.'
                        )
                    );

                };


            script.src =
                API_URL +
                '?' +
                query.toString();


            document.body.appendChild(
                script
            );

        }
    );

}



/* =========================================================
   SESJA
   ========================================================= */

function getToken() {

    return sessionStorage.getItem(
        'wms_token'
    );

}


function getLogin() {

    return sessionStorage.getItem(
        'wms_login'
    );

}


function getRole() {

    return sessionStorage.getItem(
        'wms_role'
    );

}


function clearSession() {

    sessionStorage.removeItem(
        'wms_token'
    );

    sessionStorage.removeItem(
        'wms_login'
    );

    sessionStorage.removeItem(
        'wms_role'
    );

}



/* =========================================================
   LOGOWANIE
   ========================================================= */

async function performLogin() {


    const login =
        $('loginInput')
            .value
            .trim();


    const password =
        $('passwordInput')
            .value;


    const button =
        $('loginButton');


    const message =
        $('loginMessage');


    if (
        !login ||
        !password
    ) {

        message.textContent =
            'Podaj login i hasło.';

        return;

    }


    button.disabled =
        true;


    button.textContent =
        'LOGOWANIE...';


    message.textContent =
        '';


    try {


        const result =
            await api(
                'login',
                {
                    login:
                        login,

                    password:
                        password
                }
            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result &&
                result.message
                    ?
                    result.message
                    :
                    'Błąd logowania.'
            );

        }


        sessionStorage.setItem(
            'wms_token',
            result.token
        );


        sessionStorage.setItem(
            'wms_login',
            result.login
        );


        sessionStorage.setItem(
            'wms_role',
            result.role
        );


        currentUser = {

            login:
                result.login,

            role:
                result.role,

            token:
                result.token

        };


        $('passwordInput')
            .value =
            '';


        showLoggedIn();


    } catch (error) {


        message.textContent =
            error.message ||
            'Błąd logowania.';


        button.disabled =
            false;


        button.textContent =
            'ZALOGUJ';

    }

}



/* =========================================================
   SPRAWDZENIE SESJI
   ========================================================= */

async function checkExistingSession() {


    const token =
        getToken();


    if (!token) {

        showLogin();

        return;

    }


    try {


        const result =
            await api(
                'checkSession',
                {
                    token:
                        token
                }
            );


        if (
            result &&
            result.loggedIn
        ) {


            currentUser = {

                login:
                    result.login,

                role:
                    result.role,

                token:
                    token

            };


            showLoggedIn();


        } else {

            clearSession();

            showLogin();

        }


    } catch (_) {

        clearSession();

        showLogin();

    }

}



/* =========================================================
   POKAZANIE LOGOWANIA
   ========================================================= */

function showLogin() {


    stopScanner();


    $('loginView')
        .classList
        .remove(
            'hidden'
        );


    $('mainView')
        .classList
        .add(
            'hidden'
        );


    [

        'previewView',
        'searchView',
        'googleView',
        'adminView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );


    $('loginButton')
        .disabled =
        false;


    $('loginButton')
        .textContent =
        'ZALOGUJ';


    setTimeout(
        () => {

            $('loginInput')
                .focus();

        },
        100
    );

}



/* =========================================================
   POKAZANIE APLIKACJI
   ========================================================= */

async function showLoggedIn() {


    $('loginView')
        .classList
        .add(
            'hidden'
        );


    $('mainView')
        .classList
        .remove(
            'hidden'
        );


    $('userInfo')
        .textContent =
        '👤 ' +
        currentUser.login +
        ' [' +
        currentUser.role +
        ']';


    if (
        currentUser.role ===
        'ADMIN'
    ) {

        $('adminBtn')
            .classList
            .remove(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'block';

    } else {

        $('adminBtn')
            .classList
            .add(
                'hidden'
            );

        $('backupButton')
            .style
            .display =
            'none';

    }


    await loadData();

}



/* =========================================================
   WYLOGOWANIE
   ========================================================= */

async function logout() {


    const token =
        getToken();


    stopScanner();


    try {

        if (token) {

            await api(
                'logout',
                {
                    token:
                        token
                }
            );

        }

    } catch (_) {}


    clearSession();

    scans = [];

    currentAddress =
        null;

    currentUser =
        null;


    $('counter')
        .textContent =
        '0';


    $('address')
        .textContent =
        'BRAK ADRESU';


    $('lastCode')
        .textContent =
        'Ostatni skan: -';


    showLogin();

}



/* =========================================================
   ADRES
   ========================================================= */

function formatAddress(
    address
) {


    address =
        String(
            address || ''
        );


    if (
        address.length === 6
    ) {

        return (
            address.slice(0,3) +
            ' ' +
            address.slice(3,6)
        );

    }


    return address;

}


function validAddress(
    address
) {


    if (
        !/^\d{6}$/.test(
            address
        )
    ) {

        return false;

    }


    const column =
        Number(
            address.slice(
                0,
                3
            )
        );


    const place =
        Number(
            address.slice(
                3,
                6
            )
        );


    return (

        column >= 601 &&

        column <= 614 &&

        place >= 1 &&

        place <= 107

    );

}

/* =========================================================
   DŹWIĘK
   ========================================================= */

function beep() {


    try {


        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (
            !AudioContext
        ) {

            return;

        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            'sine';


        oscillator.frequency.value =
            880;


        gain.gain.value =
            0.08;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            () => {

                oscillator.stop();

                context.close();

            },
            120
        );


    } catch (_) {}

}



/* =========================================================
   WIBRACJA
   ========================================================= */

function vibrateSuccess() {


    try {

        if (
            navigator.vibrate
        ) {

            navigator.vibrate(
                [
                    80,
                    50,
                    120
                ]
            );

        }

    } catch (_) {}

}



/* =========================================================
   SKANER — START
   ========================================================= */

async function startScanner() {


    if (
        !getToken()
    ) {

        showLogin();

        return;

    }


    if (
        cameraRunning
    ) {

        return;

    }


    $('scanBtn')
        .disabled =
        true;


    $('reader')
        .style
        .display =
        'block';


    $('scannerStatus')
        .style
        .display =
        'block';


    $('stopScanBtn')
        .classList
        .remove(
            'hidden'
        );


    setMessage(
        'Uruchamianie aparatu...'
    );


    try {


        if (
            typeof Html5Qrcode ===
            'undefined'
        ) {

            throw new Error(
                'Biblioteka skanera jeszcze się ładuje.'
            );

        }


        scanner =
            new Html5Qrcode(
                'reader'
            );


        /*
         * Najpierw próbujemy tylnej
         * kamery.
         */

        let cameraConfig = {

            facingMode:
                {
                    ideal:
                        'environment'
                }

        };


        await scanner.start(

            cameraConfig,

            {

                fps: 12,

                qrbox: {

                    width: 300,

                    height: 190

                },

                aspectRatio:
                    1.777

            },

            decodedText => {

                handleDetectedCode(
                    decodedText
                );

            },

            () => {}

        );


        cameraRunning =
            true;

        acceptingScan =
            true;

        processingScan =
            false;

        lastDetectedCode =
            '';

        lastDetectedTime =
            0;


        setMessage(
            'SKANUJ KOD'
        );


    } catch (error) {


        console.error(
            error
        );


        stopScanner();


        setMessage(
            'Nie udało się uruchomić aparatu.'
        );


        alert(
            'Nie udało się uruchomić aparatu.\n\n' +
            'Sprawdź uprawnienie aparatu oraz HTTPS.'
        );

    }

}



/* =========================================================
   SKANER — ODCZYT
   ========================================================= */

function handleDetectedCode(
    code
) {


    if (
        !cameraRunning ||
        !acceptingScan ||
        processingScan
    ) {

        return;

    }


    code =
        String(
            code || ''
        ).trim();


    if (!code) {

        return;

    }


    const now =
        Date.now();


    /*
     * Ten sam kod wykryty ponownie
     * w ciągu 1200 ms ignorujemy.
     */

    if (

        code ===
        lastDetectedCode &&

        now -
        lastDetectedTime <
        1200

    ) {

        return;

    }


    lastDetectedCode =
        code;


    lastDetectedTime =
        now;


    /*
     * Wstrzymujemy przyjmowanie
     * kolejnych odczytów na czas
     * zapisu.
     */

    acceptingScan =
        false;


    processingScan =
        true;


    beep();

    vibrateSuccess();


    processAcceptedCode(
        code
    );

}



/* =========================================================
   SKANER — ZAPIS
   ========================================================= */

async function processAcceptedCode(
    code
) {


    $('lastCode')
        .textContent =
        'Odczytano: ' +
        code;


    setMessage(
        'Zapisywanie...'
    );


    /*
     * Sprawdzenie lokalne.
     */

    if (
        scans.some(
            scan =>
                !scan.deleted &&
                scan.code === code
        )
    ) {


        $('lastCode')
            .textContent =
            'Kod już istnieje: ' +
            code;


        setMessage(
            'KOD JUŻ ISTNIEJE'
        );


        processingScan =
            false;


        acceptingScan =
            true;


        return;

    }


    const scan = {

        id:
            (
                crypto.randomUUID
                    ?
                    crypto.randomUUID()
                    :
                    String(
                        Date.now()
                    ) +
                    Math.random()
            ),

        code:
            code,

        address:
            null,

        date:
            Date.now()

    };


    try {


        const result =
            await api(

                'saveScan',

                {

                    token:
                        getToken(),

                    id:
                        scan.id,

                    code:
                        scan.code,

                    address:
                        scan.address,

                    date:
                        scan.date

                }

            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result &&
                result.message
                    ?
                    result.message
                    :
                    'Błąd zapisu.'
            );

        }


        scans.push(
            scan
        );


        updateCounter();


        $('lastCode')
            .textContent =
            '✓ Ostatni skan: ' +
            code;


        setMessage(
            'ZAPISANO'
        );


    } catch (error) {


        if (
            isSessionError(
                error
            )
        ) {

            clearSession();

            showLogin();

            return;

        }


        setMessage(
            'BŁĄD ZAPISU: ' +
            error.message
        );

    }


    processingScan =
        false;


    acceptingScan =
        true;

}



/* =========================================================
   SKANER — STOP
   ========================================================= */

function stopScanner() {


    acceptingScan =
        false;


    processingScan =
        false;


    if (
        scanner
    ) {


        scanner
            .stop()
            .catch(
                () => {}
            )
            .finally(
                () => {

                    try {

                        scanner.clear();

                    } catch (_) {}


                    scanner =
                        null;


                    finishScannerStop();

                }
            );


    } else {

        finishScannerStop();

    }

}

    cameraRunning =

    );

}

   ========================================================= */

function showPreview() {


    stopScanner();


    hideAll();


    $('previewView')
        .classList
        .remove(
            'hidden'
        );


    const groups = {};


    scans.forEach(
        scan => {

            const key =
                scan.address ||
                'BEZ ADRESU';


            if (
                !groups[key]
            ) {

                groups[key] =
                    [];

            }


            groups[key].push(
                scan
            );

        }
    );


    const keys =
        Object.keys(
            groups
        ).sort();


    const container =
        $('previewContainer');


    container.innerHTML =
        '';


    if (
        !keys.length
    ) {

        container.innerHTML =
            '<div class="card">' +
            'BRAK ZAPISANYCH SKANÓW' +
            '</div>';


        return;

    }


    keys.forEach(
        address => {


            const header =
                document.createElement(
                    'div'
                );


            header.className =
                'card-head';


            header.textContent =
                formatAddress(
                    address
                ) +
                ' — ' +
                groups[address].length;


            container.appendChild(
                header
            );


            groups[address].forEach(
                scan => {


                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    const code =
                        document.createElement(
                            'div'
                        );


                    code.className =
                        'card-code';


                    code.textContent =
                        scan.code;


                    const addressElement =
                        document.createElement(
                            'div'
                        );


                    addressElement.className =
                        'card-address';


                    addressElement.textContent =

                        scan.address
                            ?
                            'Adres: ' +
                            formatAddress(
                                scan.address
                            )
                            :
                            'Adres: OCZEKUJE NA ADRES';


                    const buttons =
                        document.createElement(
                            'div'
                        );


                    buttons.className =
                        'row-buttons';


                    const edit =
                        document.createElement(
                            'button'
                        );


                    edit.textContent =
                        'EDYTUJ';


                    edit.onclick =
                        () =>
                            editScan(
                                scan
                            );


                    buttons.append(
                        edit
                    );


                    if (
                        getRole() ===
                        'ADMIN'
                    ) {


                        const remove =
                            document.createElement(
                                'button'
                            );


                        remove.textContent =
                            'USUŃ';


                        remove.className =
                            'danger';


                        remove.onclick =
                            () =>
                                deleteScanConfirm(
                                    scan
                                );


                        buttons.append(
                            remove
                        );

                    }


                    card.append(
                        code,
                        addressElement,
                        buttons
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }
    );

}

/* =========================================================
   ZAPIS EDYCJI
   ========================================================= */

async function saveEdit(
    scan
) {


    const code =
        $('editCode')
            .value
            .trim();


    const address =
        $('editAddress')
            .value
            .trim();


    if (!code) {

        alert(
            'Wpisz kod.'
        );


        return;

    }


    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Nieprawidłowy adres.'
        );


        return;

    }


    try {


        const result =
            await api(

                'updateScan',

                {

                    token:
                        getToken(),

                    id:
                        scan.id,

                    code:
                        code,

                    address:
                        address

                }

            );


        if (
            !result ||
            !result.ok
        ) {

            throw new Error(
                result.message ||
                'Nie udało się zapisać.'
            );

        }


        const local =
            scans.find(
                item =>
                    item.id ===
                    scan.id
            );


        if (local) {

            local.code =
                code;

            local.address =
                address;

        }


        closeDialog();


        showPreview();


        setMessage(
            'Zapisano zmianę.'
        );


    } catch (error) {


        if (
            isSessionError(
                error
            )
        ) {

            clearSession();

            showLogin();

            return;

        }


        alert(
            error.message
        );

    }

}

/* =========================================================
   NAWIGACJA
   ========================================================= */

function hideAll() {


    [

        'mainView',
        'previewView',
        'searchView',
        'googleView',
        'adminView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );

}



function showMain() {


    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );


    updateCounter();

}



/* =========================================================
   MODAL
   ========================================================= */

function openDialog(
    title,
    body,
    buttons
) {


    $('dialogTitle')
        .textContent =
        title;


    $('dialogBody')
        .innerHTML =
        body;


    const box =
        $('dialogButtons');


    box.innerHTML =
        '';


    buttons.forEach(
        item => {


            const button =
                document.createElement(
                    'button'
                );


            button.textContent =
                item[0];


            button.onclick =
                item[1];


            box.appendChild(
                button
            );

        }
    );


    $('modal')
        .classList
        .remove(
            'hidden'
        );

}



function closeDialog() {


    $('modal')
        .classList
        .add(
            'hidden'
        );

}



/* =========================================================
   SESJA — BŁĄD
   ========================================================= */

function isSessionError(
    error
) {


    const message =
        error &&
        error.message
            ?
            error.message
            :
            '';


    return (
        message
            .toUpperCase()
            .includes(
                'SESJA'
            )
    );

}



/* =========================================================
   OCHRONA HTML
   ========================================================= */

function escapeHtml(
    value
) {


    return String(
        value || ''
    )

    .replaceAll(
        '&',
        '&amp;'
    )

    .replaceAll(
        '<',
        '&lt;'
    )

    .replaceAll(
        '>',
        '&gt;'
    )

    .replaceAll(
        '"',
        '&quot;'
    )

    .replaceAll(
        "'",
        '&#039;'
    );

}
