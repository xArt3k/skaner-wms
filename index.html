<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;

    color: #111111;
}

body {

}

    width: 100%;

    margin: 0 auto;
}

/* =========================
   GÓRA
   ========================= */

.top {
    display: flex;
    align-items: center;
    gap: 10px;
}

.title {
    flex: 1;
    font-size: 24px;
    font-weight: 700;
}

.counter {
    background: #000000;
    color: #ffffff;
    padding: 8px 12px;
    font-size: 18px;
    font-weight: 700;
    min-width: 42px;
    text-align: center;
}

/* =========================
   ADRES
   ========================= */

.label {
    margin-top: 15px;
    font-size: 12px;
}

.address {
    margin-top: 4px;
    background: #E8F5E9;
    padding: 12px;
    font-size: 20px;
    font-weight: 700;
    min-height: 48px;
}

/* =========================
   SKANER
   ========================= */

#reader {
    display: none;
    width: 100%;
    margin-top: 10px;
    overflow: hidden;
}

#reader video {
    width: 100% !important;
    height: auto !important;
}

/* =========================
   OSTATNI SKAN
   ========================= */

.last {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 700;
    min-height: 24px;
}

/* =========================
   PRZYCISKI
   ========================= */

button {
    width: 100%;
    min-height: 52px;
    margin-top: 8px;
    border: 1px solid #bbbbbb;
    border-radius: 4px;
    background: #efefef;
    color: #111111;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

button:active {
    transform: scale(0.99);
}

button:disabled {
    opacity: 0.55;
}

/* =========================
   KOMUNIKAT
   ========================= */

.message {
    margin-top: 5px;
    font-size: 14px;
    min-height: 22px;
}

.hidden {
    display: none !important;
}

/* =========================
   SEKCJE
   ========================= */

.section {
    margin-top: 14px;
}

.card {
    border: 1px solid #dddddd;
    padding: 12px;
    margin-top: 8px;
}

.card-head {
    background: #E8F5E9;
    padding: 12px;
    font-size: 20px;
    font-weight: 700;
}

.card-code {
    font-size: 17px;
    font-weight: 700;
}

.card-address {
    margin-top: 5px;
    font-size: 15px;
}

.row-buttons {
    display: flex;
    gap: 8px;
}

.row-buttons button {
    flex: 1;
}

.back {
    margin-bottom: 10px;
}

/* =========================
   OKNO
   ========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 1000;
}

.dialog {
    background: #ffffff;
    width: 100%;
    max-width: 720px;
    padding: 18px;
    border-radius: 12px 12px 0 0;
}

.dialog h2 {
    margin: 0 0 10px;
    font-size: 21px;
}

.dialog p {
    margin: 8px 0;
    white-space: pre-line;
}

input {
    width: 100%;
    min-height: 48px;
    padding: 10px;
    font-size: 18px;
    border: 1px solid #aaaaaa;
    border-radius: 4px;
}

.dialog-buttons {
    display: flex;
    gap: 8px;
}

.dialog-buttons button {
    flex: 1;
}

.danger {
    background: #ffebee;
}

/* =========================
   DESKTOP
   ========================= */

@media (min-width: 700px) {

    body {
        padding-top: 28px;
    }

    .modal {
        align-items: center;
    }

    .dialog {
        border-radius: 10px;
    }

}

</style>
</head>

         SZUKANIE

            class="back"

        </div>


        <div class="section">

                id="searchInput"
                placeholder="Wpisz fragment kodu">

                onclick="runSearch()">

                SZUKAJ

     MODAL
     ========================= -->

<div
    id="modal"
    class="modal hidden">

    <div class="dialog">

        <h2 id="dialogTitle"></h2>

        <div id="dialogBody"></div>

        <div
            class="dialog-buttons"
            id="dialogButtons">

        </div>

    </div>

<script>

/* =========================================================
   GOOGLE APPS SCRIPT
   =========================================================

   TO JEST TWÓJ BACKEND.

   Nie zmieniaj adresu, jeżeli jest taki jak poniżej.
   ========================================================= */

const API_URL =
    'https://script.google.com/macros/s/AKfycbxnalja50Ryc5H7t2vOBYe6c9zXN6pdOVMa6tXqne5jv3KQOS7laoo_JcEUUSlL08prrA/exec';


/* =========================================================
   ZMIENNE
   ========================================================= */

let scans = [];

let scanner = null;

let cameraRunning = false;

let takingDoubleScan = false;

let firstCode = null;

let firstDetectionTime = 0;

let currentAddress = null;


/* =========================================================
   SKRÓT
   ========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   KOMUNIKACJA Z GOOGLE APPS SCRIPT
   ========================================================= */

function api(action, params = {}) {

    return new Promise((resolve, reject) => {

        const callback =
            'cb_' +
            Date.now() +
            '_' +
            Math.floor(
                Math.random() * 100000
            );


        const script =
            document.createElement(
                'script'
            );


        const query =
            new URLSearchParams();


        query.set(
            'action',
            action
        );


        query.set(
            'callback',
            callback
        );


        Object.keys(params).forEach(
            key => {

                if (
                    params[key] !== undefined &&
                    params[key] !== null
                ) {

                    query.set(
                        key,
                        String(params[key])
                    );

                }

            }
        );


        window[callback] =
            data => {

                delete window[callback];

                script.remove();


                if (
                    data &&
                    data.ok === false
                ) {

                    reject(
                        new Error(
                            data.message ||
                            'Błąd'
                        )
                    );

                    return;

                }


                resolve(data);

            };


        script.onerror = () => {

            delete window[callback];

            script.remove();


            reject(
                new Error(
                    'Brak połączenia z Google Apps Script.'
                )
            );

        };


        script.src =
            API_URL +
            '?' +
            query.toString();


        document.body.appendChild(
            script
        );

    });

}


/* =========================================================
   ADRES
   ========================================================= */

function formatAddress(address) {

    address =
        String(
            address || ''
        );


    if (
        address.length === 6
    ) {

        return (
            address.slice(0, 3) +
            ' ' +
            address.slice(3, 6)
        );

    }


    return address;

}


/* =========================================================
   WALIDACJA ADRESU
   ========================================================= */

function validAddress(address) {

    if (
        !/^\d{6}$/.test(address)
    ) {

        return false;

    }


    const column =
        Number(
            address.slice(0, 3)
        );


    const place =
        Number(
            address.slice(3, 6)
        );


    return (
        column >= 601 &&
        column <= 614 &&
        place >= 1 &&
        place <= 107
    );

}


/* =========================================================
   KOMUNIKAT
   ========================================================= */

function setMessage(text) {

    $('message').textContent =
        text;

}


/* =========================================================
   LICZNIK
   ========================================================= */

function updateCounter() {

    scans =
        scans.filter(
            scan =>
                !scan.deleted
        );


    $('counter').textContent =
        scans.length;

}


/* =========================================================
   POBIERANIE DANYCH
   ========================================================= */

async function loadData() {

    setMessage(
        'Pobieranie danych...'
    );


    try {

        const result =
            await api(
                'getData'
            );


        scans =
            result.scans || [];


        updateCounter();


        const last =
            [...scans]
                .reverse()
                .find(
                    scan =>
                        scan.address
                );


        if (last) {

            currentAddress =
                last.address;


            $('address').textContent =
                formatAddress(
                    last.address
                );

        }


        setMessage(
            'Gotowy'
        );


    } catch (error) {

        setMessage(
            'BŁĄD: ' +
            error.message
        );

    }

}


/* =========================================================
   ZATRZYMANIE APARATU
   ========================================================= */

function stopScanner() {

    if (scanner) {

        scanner
            .stop()
            .catch(() => {})
            .finally(() => {

                $('reader').style.display =
                    'none';

                cameraRunning =
                    false;

                scanner =
                    null;

            });

    } else {

        $('reader').style.display =
            'none';

        cameraRunning =
            false;

    }


    takingDoubleScan =
        false;

    firstCode =
        null;

    firstDetectionTime =
        0;


    $('scanBtn').disabled =
        false;

}


/* =========================================================
   URUCHOMIENIE APARATU
   ========================================================= */

async function startScanner() {

    if (cameraRunning) {

        beginDoubleCapture();

        return;

    }


    $('reader').style.display =
        'block';


    setMessage(
        'Uruchamianie aparatu...'
    );


    try {

        if (
            typeof Html5Qrcode ===
            'undefined'
        ) {

            throw new Error(
                'Biblioteka skanera jeszcze się ładuje.'
            );

        }


        scanner =
            new Html5Qrcode(
                'reader'
            );


        await scanner.start(

            {
                facingMode:
                    'environment'
            },

            {
                fps: 10,

                qrbox: {
                    width: 280,
                    height: 180
                },

                aspectRatio:
                    1.777
            },

            decoded =>
                handleDetectedCode(
                    decoded
                ),

            () => {}

        );


        cameraRunning =
            true;


        setMessage(
            'Gotowy'
        );


        beginDoubleCapture();


    } catch (error) {

        stopScanner();


        setMessage(
            'Nie udało się uruchomić aparatu.'
        );


        alert(
            'Nie udało się uruchomić aparatu.\n\n' +
            'Sprawdź uprawnienie aparatu oraz czy strona działa przez HTTPS.'
        );

    }

}


/* =========================================================
   PODWÓJNY ODCZYT
   ========================================================= */

function beginDoubleCapture() {

    if (
        takingDoubleScan
    ) {

        return;

    }


    firstCode =
        null;


    firstDetectionTime =
        0;


    takingDoubleScan =
        true;


    $('scanBtn').disabled =
        true;


    setMessage(
        'Skanowanie...'
    );

}


/* =========================================================
   ODCZYT KODU
   ========================================================= */

function handleDetectedCode(
    code
) {

    code =
        String(
            code || ''
        ).trim();


    if (
        !takingDoubleScan ||
        !code
    ) {

        return;

    }


    if (
        firstCode === null
    ) {

        firstCode =
            code;


        firstDetectionTime =
            Date.now();


        return;

    }


    if (
        Date.now() -
        firstDetectionTime <
        150
    ) {

        return;

    }


    const second =
        code;


    takingDoubleScan =
        false;


    if (
        firstCode === second
    ) {

        processAcceptedCode(
            firstCode
        );

    } else {

        $('lastCode').textContent =
            'Kod nie został zapisany';


        setMessage(
            'ROZBIEŻNOŚĆ — PONÓW SKAN'
        );


        firstCode =
            null;


        $('scanBtn').disabled =
            false;

    }

}


/* =========================================================
   ZAPIS KODU
   ========================================================= */

async function processAcceptedCode(
    code
) {

    firstCode =
        null;


    if (
        scans.some(
            scan =>
                !scan.deleted &&
                scan.code === code
        )
    ) {

        $('lastCode').textContent =
            'Nie zapisano: ' +
            code;


        setMessage(
            'KOD JUŻ ISTNIEJE'
        );


        $('scanBtn').disabled =
            false;


        return;

    }


    const scan = {

        id:
            (
                crypto.randomUUID
                    ? crypto.randomUUID()
                    :
                    String(
                        Date.now()
                    ) +
                    Math.random()
            ),

        code:
            code,

        address:
            null,

        date:
            Date.now()

    };


    try {

        const result =
            await api(
                'saveScan',
                scan
            );


        if (
            !result.ok
        ) {

            setMessage(
                result.message ||
                'BŁĄD ZAPISU'
            );


            $('scanBtn').disabled =
                false;


            return;

        }


        scans.push(
            scan
        );


        updateCounter();


        $('lastCode').textContent =
            'Ostatni skan: ' +
            code;


        setMessage(
            'OK — OCZEKUJE NA ADRES'
        );


    } catch (error) {

        setMessage(
            'BŁĄD ZAPISU: ' +
            error.message
        );

    }


    $('scanBtn').disabled =
        false;

}


/* =========================================================
   OKNO ADRESU
   ========================================================= */

function showAddressDialog() {

    const pending =
        scans.filter(
            scan =>
                !scan.deleted &&
                !scan.address
        ).length;


    if (
        !pending
    ) {

        alert(
            'Brak kodów oczekujących na adres'
        );


        return;

    }


    openDialog(

        'PODAJ ADRES',

        '<p>Oczekujących kodów: ' +
        pending +
        '</p>' +

        '<p>Zakres: 601001 – 614107</p>' +

        '<input ' +
        'id="addressInput" ' +
        'inputmode="numeric" ' +
        'maxlength="6" ' +
        'placeholder="np. 601001">',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'OK',
                assignAddressFromDialog
            ]

        ]

    );

}


/* =========================================================
   PRZYPISANIE ADRESU
   ========================================================= */

async function assignAddressFromDialog() {

    const address =
        $('addressInput')
            .value
            .trim();


    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Adres musi mieć format 601001 i zakres 601001–614107'
        );


        return;

    }


    try {

        const result =
            await api(
                'assignAddress',
                {
                    address:
                        address
                }
            );


        scans.forEach(
            scan => {

                if (
                    !scan.deleted &&
                    !scan.address
                ) {

                    scan.address =
                        address;

                }

            }
        );


        currentAddress =
            address;


        $('address').textContent =
            formatAddress(
                address
            );


        $('lastCode').textContent =
            'Przypisano ' +
            result.count +
            ' kodów';


        setMessage(
            '✓ ' +
            result.count +
            ' kodów zapisano w Google'
        );


        closeDialog();


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   PODGLĄD
   ========================================================= */

function showPreview() {

    hideAll();


    $('previewView')
        .classList
        .remove(
            'hidden'
        );


    const groups = {};


    scans.forEach(
        scan => {

            const key =
                scan.address ||
                'BEZ ADRESU';


            if (
                !groups[key]
            ) {

                groups[key] =
                    [];

            }


            groups[key].push(
                scan
            );

        }
    );


    const keys =
        Object.keys(
            groups
        ).sort();


    const container =
        $('previewContainer');


    container.innerHTML =
        '';


    if (
        !keys.length
    ) {

        container.innerHTML =
            '<div class="card">' +
            'BRAK ZAPISANYCH SKANÓW' +
            '</div>';


        return;

    }


    keys.forEach(
        address => {

            const header =
                document.createElement(
                    'div'
                );


            header.className =
                'card-head';


            header.textContent =
                formatAddress(
                    address
                ) +
                ' — ' +
                groups[address].length;


            container.appendChild(
                header
            );


            groups[address].forEach(
                scan => {

                    const card =
                        document.createElement(
                            'div'
                        );


                    card.className =
                        'card';


                    const code =
                        document.createElement(
                            'div'
                        );


                    code.className =
                        'card-code';


                    code.textContent =
                        scan.code;


                    const addr =
                        document.createElement(
                            'div'
                        );


                    addr.className =
                        'card-address';


                    addr.textContent =
                        scan.address
                            ?
                            'Adres: ' +
                            formatAddress(
                                scan.address
                            )
                            :
                            'Adres: OCZEKUJE NA ADRES';


                    const buttons =
                        document.createElement(
                            'div'
                        );


                    buttons.className =
                        'row-buttons';


                    const edit =
                        document.createElement(
                            'button'
                        );


                    edit.textContent =
                        'EDYTUJ';


                    edit.onclick =
                        () =>
                            editScan(
                                scan
                            );


                    const remove =
                        document.createElement(
                            'button'
                        );


                    remove.textContent =
                        'USUŃ';


                    remove.className =
                        'danger';


                    remove.onclick =
                        () =>
                            deleteScanConfirm(
                                scan
                            );


                    buttons.append(
                        edit,
                        remove
                    );


                    card.append(
                        code,
                        addr,
                        buttons
                    );


                    container.appendChild(
                        card
                    );

                }
            );

        }
    );

}


/* =========================================================
   EDYCJA
   ========================================================= */

function editScan(scan) {

    openDialog(

        'EDYTUJ SKAN',

        '<input id="editCode" value="' +
        escapeHtml(
            scan.code
        ) +
        '" placeholder="Kod">' +

        '<br><br>' +

        '<input id="editAddress" ' +
        'inputmode="numeric" ' +
        'maxlength="6" ' +
        'value="' +
        escapeHtml(
            scan.address || ''
        ) +
        '" placeholder="Adres np. 601001">',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'ZAPISZ',
                () =>
                    saveEdit(
                        scan
                    )
            ]

        ]

    );

}


/* =========================================================
   ZAPIS EDYCJI
   ========================================================= */

async function saveEdit(
    scan
) {

    const code =
        $('editCode')
            .value
            .trim();


    const address =
        $('editAddress')
            .value
            .trim();


    if (
        !code
    ) {

        alert(
            'Wpisz kod'
        );


        return;

    }


    if (
        !validAddress(
            address
        )
    ) {

        alert(
            'Nieprawidłowy adres'
        );


        return;

    }


    try {

        const result =
            await api(
                'updateScan',
                {
                    id:
                        scan.id,

                    code:
                        code,

                    address:
                        address
                }
            );


        if (
            !result.ok
        ) {

            alert(
                result.message ||
                'Nie udało się zapisać'
            );


            return;

        }


        const local =
            scans.find(
                item =>
                    item.id ===
                    scan.id
            );


        if (local) {

            local.code =
                code;


            local.address =
                address;

        }


        closeDialog();


        showPreview();


        setMessage(
            'Zapisano zmianę'
        );


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   USUWANIE
   ========================================================= */

function deleteScanConfirm(
    scan
) {

    openDialog(

        'USUŃ SKAN',

        '<p>Czy na pewno usunąć kod <b>' +
        escapeHtml(
            scan.code
        ) +
        '</b>?</p>',

        [

            [
                'ANULUJ',
                closeDialog
            ],

            [
                'USUŃ',
                () =>
                    performDelete(
                        scan
                    )
            ]

        ]

    );

}


/* =========================================================
   WYKONANIE USUNIĘCIA
   ========================================================= */

async function performDelete(
    scan
) {

    try {

        await api(
            'deleteScan',
            {
                id:
                    scan.id
            }
        );


        scans =
            scans.filter(
                item =>
                    item.id !==
                    scan.id
            );


        updateCounter();


        closeDialog();


        showPreview();


        setMessage(
            'Usunięto skan'
        );


    } catch (error) {

        alert(
            error.message
        );

    }

}


/* =========================================================
   SZUKANIE
   ========================================================= */

function showSearch() {

    hideAll();


    $('searchView')
        .classList
        .remove(
            'hidden'
        );


    $('searchInput')
        .focus();

}


/* =========================================================
   WYKONANIE SZUKANIA
   ========================================================= */

function runSearch() {

    const query =
        $('searchInput')
            .value
            .trim();


    if (
        !query
    ) {

        $('searchResult')
            .textContent =
            'Wpisz fragment kodu i kliknij SZUKAJ';


        return;

    }


    const results =
        scans.filter(
            scan =>
                scan.code
                    .toLowerCase()
                    .includes(
                        query.toLowerCase()
                    )
        );


    if (
        !results.length
    ) {

        $('searchResult')
            .textContent =
            'BRAK WYNIKU\n\n' +
            'Szukany fragment:\n' +
            query;


        return;

    }


    let html =
        '<div class="card">' +
        '<b>ZNALEZIONO: ' +
        results.length +
        '</b></div>';


    results.forEach(
        (
            scan,
            index
        ) => {

            html +=
                '<div class="card">' +

                '<div class="card-code">' +

                (
                    index + 1
                ) +

                '. ' +

                escapeHtml(
                    scan.code
                ) +

                '</div>' +

                '<div class="card-address">' +

                'ADRES: ' +

                (
                    scan.address
                        ?
                        escapeHtml(
                            formatAddress(
                                scan.address
                            )
                        )
                        :
                        'OCZEKUJE NA ADRES'
                ) +

                '</div>' +

                '</div>';

        }
    );


    $('searchResult')
        .innerHTML =
        html;

}


/* =========================================================
   GOOGLE
   ========================================================= */

function showGoogle() {

    hideAll();


    $('googleView')
        .classList
        .remove(
            'hidden'
        );

}


/* =========================================================
   PONOWNE POBRANIE
   ========================================================= */

async function reloadData() {

    $('googleStatus')
        .textContent =
        'Pobieranie...';


    await loadData();


    $('googleStatus')

/* =========================================================
   BACKUP
   ========================================================= */

async function backupData() {

        'Tworzenie kopii...';


    try {

        const result =
            await api(
                'exportJson'
            );


        $('googleStatus')
            .textContent =

    } catch (error) {

        $('googleStatus')
            .textContent =

}


/* =========================================================
   NAWIGACJA
   ========================================================= */

function hideAll() {

    [

        'mainView',
        'previewView',
        'searchView',
        'googleView'

    ].forEach(
        id => {

            $(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );

}


function showMain() {

    hideAll();


    $('mainView')
        .classList
        .remove(
            'hidden'
        );

}


/* =========================================================
   MODAL
   ========================================================= */

function openDialog(
    title,
    body,
    buttons
) {

    $('dialogTitle')
        .textContent =
        title;


    $('dialogBody')
        .innerHTML =
        body;


    const box =
        $('dialogButtons');


    box.innerHTML =
        '';


    buttons.forEach(
        (
            item
        ) => {

            const button =
                document.createElement(
                    'button'
                );


            button.textContent =
                item[0];


            button.onclick =
                item[1];


            box.appendChild(
                button
            );

        }
    );


    $('modal')
        .classList
        .remove(
            'hidden'
        );

}


function closeDialog() {

    $('modal')
        .classList
        .add(
            'hidden'
        );

}


/* =========================================================
   OCHRONA HTML
   ========================================================= */

function escapeHtml(
    value
) {

    return String(
        value || ''
    )

        .replaceAll(
            '&',
            '&amp;'
        )

        .replaceAll(
            '<',
            '&lt;'
        )

        .replaceAll(
            '>',
            '&gt;'
        )

        .replaceAll(
            '"',
            '&quot;'
        )

        .replaceAll(
            "'",
            '&#039;'
        );

}

   PRZYCISKI
   ========================================================= */

    startScanner;


$('addressBtn')

$('searchBtn')

$('googleBtn')

    showGoogle;


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    'load',
    loadData
);


window.addEventListener(
    'beforeunload',
    stopScanner
);

</script>
